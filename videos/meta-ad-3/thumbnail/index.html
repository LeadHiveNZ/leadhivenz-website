<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Claude AI workshop thumbnail</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Noto Color Emoji'; src: url('assets/fonts/NotoColorEmoji.ttf'); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0A1628; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0A1628; font-family: Montserrat, 'Noto Color Emoji', sans-serif; }
      /* first-second frame (1080x1920), face centred in the square */
      #frame { position: absolute; left: 0; top: -470px; width: 1080px; height: 1920px; object-fit: cover; }
      #card-row { position: absolute; left: 40px; right: 40px; top: 70px; display: flex; justify-content: center; }
      #card { display: inline-flex; align-items: center; gap: 26px; background: rgba(10,22,40,0.90); color: #F5F2EA; border-radius: 34px;
              padding: 26px 46px; font-weight: 800; font-size: 128px; line-height: 1; letter-spacing: -0.02em; white-space: nowrap;
              box-shadow: 0 20px 44px rgba(0,0,0,0.35); }
      #card .g { color: #FFB900; }
      #badge { position: absolute; right: 40px; bottom: 44px; background: #0A1628; color: #FFB900; font-size: 40px; font-weight: 800;
               padding: 14px 26px; border-radius: 20px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1080" data-duration="1">
      <img id="frame" class="clip" src="assets/thumb-frame.jpg" data-start="0" data-duration="1" data-track-index="0" alt="" />
      <div id="card-row" class="clip" data-start="0" data-duration="1" data-track-index="1"><div id="card">$1,000 <span class="g">→ $50</span></div></div>
      <div id="badge" class="clip" data-start="0" data-duration="1" data-track-index="2">📅 WED 28 OCT · 7:30PM NZT</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 1);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
