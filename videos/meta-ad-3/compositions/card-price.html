<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>card-price</title></head>
  <body>
    <template>
      <style>
#root { position:absolute; inset:0; font-family:Montserrat, sans-serif; color:#F5F2EA; }
.row { position:absolute; left:60px; right:60px; top:404px; display:flex; justify-content:center; }
.card { display:inline-flex; align-items:center; gap:22px; background:rgba(10,22,40,0.90); border-radius:30px; padding:22px 40px;
        font-weight:800; white-space:nowrap; box-shadow:0 18px 40px rgba(0,0,0,0.28); opacity:0; will-change:transform; transform-origin:50% 50%; }
.g { color:#FFB900; }
.big { font-size:110px; letter-spacing:-0.02em; line-height:1; }
.mid { font-size:66px; line-height:1.05; }
.pop { display:none; opacity:0; will-change:transform; transform-origin:50% 60%; }
.tick { width:62px; height:62px; flex:none; }
</style>
      <div id="root" data-composition-id="card-price" data-width="1080" data-height="1920">
<div class="row"><div class="card" id="card-price-c"><span class="big">$1,000</span><span class="big g">→</span><span class="big g pop" id="card-price-new">$50</span></div></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
tl.fromTo("#card-price-c", { opacity: 0, scale: 0.86, y: 18 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "power3.out" }, 0);
tl.set("#card-price-new", { display: "inline-block" }, 1.100);
tl.fromTo("#card-price-new", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power3.out" }, 1.100);
tl.fromTo("#card-price-c", { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 1.100);
tl.to("#card-price-c", { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" }, 1.260);

          window.__timelines["card-price"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
