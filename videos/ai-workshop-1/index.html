<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Claude AI workshop for tradies</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0F1A2E; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0F1A2E; }
      #video-wrap { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
      #video-wrap video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="29.400">
      <div id="video-wrap">
      <video id="v0" class="clip" src="assets/workshop.mp4" muted playsinline data-start="0.000" data-duration="5.670" data-media-start="0.250" data-track-index="0"></video>
      <video id="v1" class="clip" src="assets/workshop.mp4" muted playsinline data-start="5.630" data-duration="3.260" data-media-start="7.060" data-track-index="0"></video>
      <video id="v2" class="clip" src="assets/workshop.mp4" muted playsinline data-start="8.850" data-duration="3.320" data-media-start="11.000" data-track-index="0"></video>
      <video id="v3" class="clip" src="assets/workshop.mp4" muted playsinline data-start="12.130" data-duration="2.760" data-media-start="14.680" data-track-index="0"></video>
      <video id="v4" class="clip" src="assets/workshop.mp4" muted playsinline data-start="14.850" data-duration="4.680" data-media-start="20.200" data-track-index="0"></video>
      <video id="v5" class="clip" src="assets/workshop.mp4" muted playsinline data-start="19.490" data-duration="6.520" data-media-start="25.640" data-track-index="0"></video>
      <video id="v6" class="clip" src="assets/workshop.mp4" muted playsinline data-start="25.970" data-duration="3.430" data-media-start="33.400" data-track-index="0"></video>
      </div>
      <audio id="mix" src="assets/mix.m4a" data-start="0" data-duration="29.400" data-track-index="3" data-volume="1"></audio>
      <div id="card-details-host" data-composition-id="card-details" data-composition-src="compositions/card-details.html" data-start="15.900" data-duration="3.630" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="card-refund-host" data-composition-id="card-refund" data-composition-src="compositions/card-refund.html" data-start="23.400" data-duration="2.610" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="card-link-host" data-composition-id="card-link" data-composition-src="compositions/card-link.html" data-start="27.020" data-duration="2.380" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="captions-host" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="29.400" data-track-index="1" data-track-kind="captions" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#video-wrap", { scale: 1.150, y: -62 }, 0.000);
      tl.set("#video-wrap", { scale: 1.219, y: -62 }, 5.630);
      tl.set("#video-wrap", { scale: 1.150, y: -62 }, 8.850);
      tl.set("#video-wrap", { scale: 1.219, y: -62 }, 12.130);
      tl.set("#video-wrap", { scale: 1.150, y: -62 }, 14.850);
      tl.set("#video-wrap", { scale: 1.219, y: -62 }, 19.490);
      tl.set("#video-wrap", { scale: 1.150, y: -62 }, 25.970);
      tl.set({}, {}, 29.400);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
