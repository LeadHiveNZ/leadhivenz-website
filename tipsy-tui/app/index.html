<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tipsy Tui Bookings</title>
<meta name="description" content="Job scheduler for The Tipsy Tui mobile caravan bar: upcoming events, run sheets, checklists and crew.">
<meta name="theme-color" content="#1B4F4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tipsy Tui">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- APP:START -->
<div class="shell">
  <nav class="tabbar" id="tabbar" hidden>
    <div class="logo-rail"><img src="logo-small.jpg" alt=""><b>The Tipsy Tui</b></div>
    <button data-view="jobs" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 2v4M16 2v4"/><path d="M8 14h3M8 18h6"/></svg>
      <span class="lbl">Jobs</span>
    </button>
    <button data-view="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/><circle cx="12" cy="16" r="1.5" fill="currentColor" stroke="none"/></svg>
      <span class="lbl">Calendar</span>
    </button>
    <button data-view="new" class="primary-tab">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <span class="lbl">Book</span>
    </button>
    <button data-view="todo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span class="lbl">To-do</span>
    </button>
    <button data-view="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg>
      <span class="lbl">More</span>
    </button>
  </nav>

  <div class="grow" style="min-width:0">
    <header class="topbar" id="topbar" hidden>
      <div class="brand">
        <img src="logo-small.jpg" alt="The Tipsy Tui">
        <div>
          <div class="brand-name">The Tipsy Tui</div>
          <div class="brand-sub">Bookings</div>
        </div>
      </div>
      <div class="spacer"></div>
      <span class="pill-mode" id="modePill" hidden>Demo</span>
    </header>
    <main class="main" id="view"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- APP:END -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
