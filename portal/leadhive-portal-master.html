<!doctype html>
<html lang="en">
<head>
<!--
  LEADHIVE — PARTNER PORTAL MASTER  v1
  Mobile-first client portal: each LeadHive partner logs in and sees their leads, calls,
  recordings, monthly notes and web enquiries. Joe (admin) uploads a Nimbata call export
  per client per month, writes the notes, and publishes.

  This file is the design + behaviour reference for the Lovable build (see README.md).
  It runs fully in the browser on demo data (saved in localStorage) so it can be used
  in sales calls as-is. Nothing here talks to a server.

  Demo logins (prototype only):
    client  mike@mikesplumbing.co.nz / demo
    admin   hello@leadhivenz.com     / admin
-->
<meta charset="utf-8">
<title>LeadHive Partner Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LeadHive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6FA; --card:#FFFFFF; --ink:#0F1A2E; --ink-2:#4A5668; --ink-3:#8A96A3; --rule:#DDE3ED; --rule-2:#EDF1F6;
  --navy:#0F1A2E; --navy-2:#1B2B4A; --gold:#EFA41E; --gold-ink:#7A4E00; --gold-bg:#FFF4DC;
  --blue:#0077C0; --blue-lo:#D9ECF8; --blue-track:#E4F0F9;
  --good:#158A4F; --good-bg:#E4F5EC; --warn:#B86E00; --warn-bg:#FFF1D6; --bad:#C93A3A; --bad-bg:#FBE7E7;
  --shell:600px; --bar:64px;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --head:"Space Grotesk",var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-weight:400;background:var(--paper);color:var(--ink);line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh}
body.has-tabs{padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 12px)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.head{font-family:var(--head);letter-spacing:-.3px}
.shell{max-width:var(--shell);margin:0 auto;padding:0 18px}
.ico{width:18px;height:18px;flex:none;fill:currentColor}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
.top-in{max-width:var(--shell);margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px;min-height:58px}
.top .back{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-left:-8px;color:#fff}
.top .back:active{background:rgba(255,255,255,.12)}
.top .ttl{font-family:var(--head);font-weight:600;font-size:17px;flex:1;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;opacity:.7;letter-spacing:0}
.brand{display:flex;align-items:center;gap:9px;flex:1}
.brand .mk{width:30px;height:30px}
.brand .nm{font-family:var(--head);font-weight:700;font-size:18px;letter-spacing:-.4px}
.brand .nm span{color:var(--gold)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--head);flex:none}
.pill-admin{font-size:11px;font-weight:700;letter-spacing:.4px;background:var(--gold);color:var(--navy);padding:4px 8px;border-radius:99px}

/* cards + type */
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px}
.card+.card{margin-top:12px}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sec-h h2{font-size:16px;font-weight:600}
.sec-h a,.sec-h button{font-size:13.5px;font-weight:600;color:var(--blue);text-decoration:none}
.lede{font-size:14.5px;color:var(--ink-2);line-height:1.5}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.b{font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.right{text-align:right}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}

/* chips + badges */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--rule-2);color:var(--ink-2);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.blue{background:var(--blue-lo);color:#005B93}
.chip.gold{background:var(--gold-bg);color:var(--gold-ink)}
.chip.navy{background:var(--navy);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips .f{flex:none;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--rule);color:var(--ink-2)}
.chips .f.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* hero + stats */
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(closest-side,rgba(239,164,30,.35),transparent)}
.hero .k{font-size:12.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;opacity:.75}
.hero .n{font-family:var(--head);font-size:56px;font-weight:700;line-height:1;letter-spacing:-2px;margin:6px 0 2px}
.hero .n small{font-size:18px;font-weight:600;letter-spacing:-.3px;margin-left:6px;opacity:.9}
.hero .sub{font-size:14px;opacity:.8}
.meter{margin-top:14px;position:relative;height:10px;border-radius:99px;background:rgba(255,255,255,.14)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--gold);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter .fill.good{background:#3DBE7A}
.meter .tick{position:absolute;top:-4px;width:2px;height:18px;background:#fff;opacity:.85;border-radius:2px}
.meter-l{display:flex;justify-content:space-between;font-size:12px;opacity:.75;margin-top:7px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:13px 14px 12px}
.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:500}
.kpi .v{font-family:var(--head);font-size:26px;font-weight:700;letter-spacing:-.8px;line-height:1.15;margin-top:3px}
.kpi .v small{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-left:3px}
.kpi .d{font-size:12px;margin-top:4px;font-weight:600;display:flex;align-items:center;gap:4px}
.kpi .d.up{color:var(--good)}.kpi .d.dn{color:var(--bad)}.kpi .d.flat{color:var(--ink-3)}

/* note card */
.note{border-left:4px solid var(--gold)}
.note .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.note .who .avatar{width:30px;height:30px;font-size:12px}
.note .who b{font-size:14px;display:block}
.note .who small{font-size:12px;color:var(--ink-3)}
.note p{font-size:14.5px;line-height:1.5;color:var(--ink)}
.note p+p{margin-top:8px}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .t{font-size:11.5px;fill:var(--ink-3)}
.chart .v{font-size:12px;font-weight:600;fill:var(--ink)}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart rect.bar{fill:#C7D3DF}
.chart rect.bar.on{fill:var(--blue)}
.chart rect.bar.gold{fill:var(--gold)}
.chart rect.hit{fill:transparent;cursor:pointer}
.chart rect.hit:hover+rect.bar,.chart rect.hit:focus+rect.bar{filter:brightness(1.12)}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--navy);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:9px;box-shadow:0 8px 24px -8px rgba(15,26,46,.5);transform:translate(-50%,calc(-100% - 10px));white-space:nowrap}
.tip b{display:block;font-size:14px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* lists */
.list{background:var(--card);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.list .day{font-size:12px;font-weight:600;color:var(--ink-3);padding:12px 16px 4px;letter-spacing:.3px;text-transform:uppercase;background:var(--card)}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--rule-2);text-decoration:none;color:inherit;width:100%;text-align:left}
.li:active{background:var(--paper)}
.li .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--blue-lo);color:var(--blue)}
.li .ic.form{background:var(--gold-bg);color:var(--gold-ink)}
.li .ic.miss{background:var(--bad-bg);color:var(--bad)}
.li .ic .ico{width:19px;height:19px}
.li .t1{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.li .t1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t2{font-size:13px;color:var(--ink-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.li .t2 .chip{font-size:11px;padding:2px 7px}
.li .t2 span.tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{text-align:right;flex:none}
.li .meta .tm{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.li .meta .du{font-size:12.5px;font-weight:600;margin-top:3px;color:var(--ink-2)}
.li .chev{color:var(--ink-3);width:16px;height:16px;flex:none}
.play{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}
.play .ico{width:12px;height:12px;margin-left:2px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:14px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:13px;font-size:15.5px;font-weight:700;text-decoration:none;font-family:var(--head);letter-spacing:-.2px}
.btn.primary{background:var(--gold);color:var(--navy)}
.btn.primary:active{filter:brightness(.95)}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:var(--card);border:1.5px solid var(--rule);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn[disabled]{opacity:.5}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:11px;width:auto}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

/* forms */
.fld{display:block;margin-top:12px}
.fld>span{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;font-size:16px;padding:12px 13px;border:1px solid var(--rule);border-radius:11px;background:var(--paper);color:var(--ink)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.fld textarea{min-height:92px;resize:vertical;line-height:1.45}
.fld .hint{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--rule-2)}
.switch:first-child{border-top:0}
.switch b{font-size:14.5px;display:block}
.switch small{font-size:12.5px;color:var(--ink-3);display:block;margin-top:2px;line-height:1.35}
.tog{width:46px;height:28px;border-radius:99px;background:#CBD5E0;position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog.on{background:var(--good)}.tog.on::after{left:21px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{padding:9px 2px;min-height:60px;border-radius:10px;border:1.5px solid var(--rule);background:var(--card);font-size:11.5px;line-height:1.15;text-align:center;font-weight:600;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px}
.seg button .ico{width:17px;height:17px}
.seg button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.seg button.on.won{background:var(--good);border-color:var(--good)}
.seg button.on.spam,.seg button.on.not_lead{background:var(--ink-2);border-color:var(--ink-2)}

/* detail */
.big-num{font-family:var(--head);font-size:34px;font-weight:700;letter-spacing:-1.2px;line-height:1.1}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px}
.facts div{font-size:14px}
.facts div small{display:block;font-size:12px;color:var(--ink-3);margin-bottom:1px}
.player{display:flex;align-items:center;gap:12px;margin-top:10px}
.player .play{width:44px;height:44px}
.player .play .ico{width:17px;height:17px}
.player .track{flex:1;height:6px;border-radius:99px;background:var(--blue-track);position:relative;cursor:pointer}
.player .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--blue);width:0}
.player .tm{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none;min-width:72px;text-align:right}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabs-in{max-width:var(--shell);margin:0 auto;display:flex}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;text-decoration:none;font-size:11px;font-weight:600;color:var(--ink-3)}
.tabs a .ico{width:22px;height:22px}
.tabs a.on{color:var(--navy)}
.tabs a .bdg{position:absolute;margin-left:22px;margin-top:-2px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:99px}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;background:var(--navy);color:#fff}
.login .hd{padding:calc(48px + env(safe-area-inset-top)) 24px 28px;text-align:center}
.login .hd .mk{width:64px;height:64px;margin:0 auto 14px}
.login .hd h1{font-size:28px;font-weight:700;letter-spacing:-.8px}
.login .hd h1 span{color:var(--gold)}
.login .hd p{font-size:14.5px;opacity:.75;margin-top:6px}
.login .pane{background:var(--paper);color:var(--ink);border-radius:24px 24px 0 0;flex:1;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
.login .pane h2{font-size:20px;font-weight:600}
.login .pane .fld{margin-top:14px}
.login .err{color:var(--bad);font-size:13.5px;margin-top:10px;font-weight:600}
.demo{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.demo code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-2);background:var(--rule-2);padding:1px 5px;border-radius:5px}

/* table (admin csv preview + report table) */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule-2);vertical-align:top}
.tbl th{font-size:11.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rpt-k{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule-2);font-size:14.5px}
.rpt-k:last-child{border-bottom:0}
.rpt-k b{font-variant-numeric:tabular-nums}
.pt{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--rule-2)}
.pt:first-child{border-top:0;padding-top:0}
.pt .ix{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold-bg);color:var(--gold-ink);font-family:var(--head);font-weight:700;font-size:13px;display:grid;place-items:center}
.pt b{display:block;font-size:14.5px}
.pt p{font-size:14px;color:var(--ink-2);line-height:1.45;margin-top:2px}

/* admin */
.drop{display:block;border:2px dashed var(--rule);border-radius:14px;padding:22px 16px;text-align:center;color:var(--ink-2);font-size:14px;background:var(--card)}
.drop.on{border-color:var(--blue);background:var(--blue-lo)}
.drop b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.drop input{display:none}
.steps{display:flex;gap:6px;margin:14px 0 6px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--rule)}
.steps i.on{background:var(--gold)}
.map{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px}
.map div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule-2)}
.map div span:last-child{color:var(--ink-3);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
.map div.ok span:last-child{color:var(--good);font-weight:600}
.client-li .ic{background:var(--navy);color:#fff;font-family:var(--head);font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--bar) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;z-index:90;pointer-events:none;white-space:nowrap;box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.dev{position:fixed;top:8px;right:8px;z-index:60;font-size:11px;background:#111;color:#fff;padding:5px 8px;border-radius:6px;opacity:.75}
.dev a{color:#fff;margin-left:6px}
@media(min-width:640px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){.meter .fill,.toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs" class="tabs hidden"><div class="tabs-in" id="tabs-in"></div></nav>
<div id="toast" class="toast"></div>
<div id="tip" class="tip hidden"></div>

<script>
/* ═══════════════════════════ utilities ═══════════════════════════ */
const $=(id)=>document.getElementById(id);
const h=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const money=(n,dp=0)=>"$"+Number(n||0).toLocaleString("en-NZ",{minimumFractionDigits:dp,maximumFractionDigits:dp});
const pct=(a,b)=>b?Math.round(a/b*100):0;
const dur=(s)=>{s=Math.round(s||0);const m=Math.floor(s/60),r=s%60;return m?`${m}m ${String(r).padStart(2,"0")}s`:`${r}s`};
const durShort=(s)=>{s=Math.round(s||0);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`};
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ymOf=(d)=>{d=new Date(d);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`};
const ymLabel=(ym,long=true)=>{const [y,m]=ym.split("-").map(Number);return `${(long?MONTHS:MON)[m-1]} ${y}`};

function parseCSV(text){

    else cur+=ch}

const norm=(s)=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");

/* ═══════════════════════════ demo audio (a stand-in for a Nimbata recording) ═══════════════════════════ */
let AUDIO_URL=null;
function demoRecording(){
  if(AUDIO_URL)return AUDIO_URL;
  const sr=8000,secs=12,n=sr*secs,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  const r=rng(7);let ph=0;
  for(let i=0;i<n;i++){const t=i/sr;let s=0;
    if(t<2.4){const on=(t%1.2)<.4;s=on?(Math.sin(2*Math.PI*425*t)*.35):0} // ring tone
    else{const env=.5+.5*Math.sin(2*Math.PI*.9*t+Math.sin(t*3));const f=140+40*Math.sin(t*2.1);ph+=2*Math.PI*f/sr;s=(Math.sin(ph)*.5+Math.sin(ph*2)*.25+(r()-.5)*.35)*env*.4;if(Math.floor(t*2)%3===2)s*=.15}
    v.setInt16(44+i*2,Math.max(-1,Math.min(1,s))*32767,true)}
  AUDIO_URL=URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));return AUDIO_URL;
}

/* ═══════════════════════════ charts ═══════════════════════════ */
function columnChart({labels,values,highlight=-1,gold=[],height=150,valueFmt=(v)=>v,tipFmt}){
  const W=360,H=height,padL=6,padR=6,padT=18,padB=24;const n=values.length;const max=Math.max(1,...values);
  const niceMax=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const m=max/p;const s=m<=1?1:m<=2?2:m<=5?5:10;return s*p})();
  const slot=(W-padL-padR)/n;const bw=Math.min(24,slot*.6);const y=(v)=>padT+(H-padT-padB)*(1-v/niceMax);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Column chart">`;
  for(const g of [0,.5,1]){const yy=y(niceMax*g);s+=`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/>`;if(g>0)s+=`<text class="t" x="${W-padR}" y="${(yy-3).toFixed(1)}" text-anchor="end">${valueFmt(niceMax*g)}</text>`}
  values.forEach((v,i)=>{const x=padL+slot*i+(slot-bw)/2;const top=y(v);const hgt=Math.max(0,H-padB-top);const cls=gold.includes(i)?"bar gold":i===highlight?"bar on":"bar";
    const tipText=tipFmt?tipFmt(i):`${labels[i]}: ${valueFmt(v)}`;
    s+=`<rect class="hit" x="${(padL+slot*i).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${H-padT-padB}" data-tip="${h(tipText)}" tabindex="0"/>`;
    s+=`<path class="${cls}" d="M${x.toFixed(1)},${(H-padB).toFixed(1)} v${(-hgt+4).toFixed(1)} a4,4 0 0 1 4,-4 h${(bw-8).toFixed(1)} a4,4 0 0 1 4,4 v${(hgt-4).toFixed(1)} z" style="fill:${gold.includes(i)?"var(--gold)":i===highlight?"var(--blue)":"#C7D3DF"};pointer-events:none"/>`;
    if(i===highlight||gold.includes(i)||n<=6)s+=`<text class="v" x="${(x+bw/2).toFixed(1)}" y="${(top-5).toFixed(1)}" text-anchor="middle">${valueFmt(v)}</text>`;
    s+=`<text class="t" x="${(x+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${h(labels[i])}</text>`});
  return s+"</svg>";
}

function route(){
  const user=SESSION.get();

  const parts=hash.split("/").filter(Boolean);
  const app=$("app");window.scrollTo(0,0);
  if(!user){document.body.classList.remove("has-tabs");$("tabs").classList.add("hidden");return renderLogin(app)}
  const isAdmin=user.role==="admin";
  const seg=parts[0]||(isAdmin?"admin":"home");
  // routes:  #/home, #/leads/<ym>/<filter>, #/lead/<id>, #/reports, #/report/<ym>, #/account
  //          #/admin, #/admin/client/<id>, #/admin/upload/<id>/<ym>, #/admin/settings/<id>, #/admin/newclient
  //          #/as/<clientId>/<any client route>   (admin viewing the portal as that client)
  let cid=user.clientId,page,args;
  if(seg==="admin"){page=parts[1]||"admin";args=parts.slice(2)}
  else if(seg==="as"&&isAdmin){cid=parts[1];page=parts[2]||"home";args=parts.slice(3)}
  else{page=seg;args=parts.slice(1)}
  const screens={home:renderHome,leads:renderLeads,lead:renderLead,reports:renderReports,report:renderReport,account:renderAccount,admin:renderAdmin,client:renderAdminClient,upload:renderUpload,settings:renderSettings,newclient:renderSettings};

  if(seg==="admin"){if(!isAdmin)return go("/home");}

}

function clientStatus(c){
  const lastPub=DB.months.filter(m=>m.clientId===c.id&&m.status==="published").map(m=>m.ym).sort().pop();
  const prevYm=ymAdd(CUR_YM,-1);const draft=DB.months.find(m=>m.clientId===c.id&&m.ym===prevYm&&m.status==="draft");
  if(ymOf(c.started)>=CUR_YM||(ymOf(c.started)===prevYm&&new Date(c.started).getDate()>20))return {cls:"blue",l:"New · first month running"};
  if(lastPub===prevYm)return {cls:"good",l:`${ymLabel(prevYm,false)} published`};
  if(draft)return {cls:"warn",l:`${ymLabel(prevYm,false)} draft, not published`};
  return {cls:"bad",l:`${ymLabel(prevYm,false)} report due`};
}
