# Netlify config for the LeadHive Partner Portal.
# In the Netlify UI set  Base directory = portal/app  (this file is read from there).
# No build step: the app is static files in public/ plus the functions below.

[build]
  publish = "public"
  command = "echo 'static site, nothing to build'"

# Netlify fails a build when an env var's value also appears in the code. These three are
# public on purpose (config.js gives the URLs to every browser), so skip them in the scan.
# SUPABASE_SERVICE_ROLE_KEY and RESEND_API_KEY are still scanned and must never be committed.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,PORTAL_URL,RESEND_FROM_EMAIL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Friendly API paths → functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
