# Netlify config for the LeadHive Partner Portal.
# In the Netlify UI set  Base directory = portal/app  (this file is read from there).
# No build step: the app is static files in public/ plus the functions below.

[build]
  publish = "public"
  command = "echo 'static site, nothing to build'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Friendly API paths → functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
