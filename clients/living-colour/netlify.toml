# Used when the site is deployed from Git (Netlify builds it).
# For drag-and-drop deploys of the zip, dist/_headers and dist/_redirects do the same job.
[build]
  command = "python3 build.py"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[redirects]]
  from = "/registration"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/contact-us"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/gallery"
  to = "/projects/"
  status = 301

# Anything else that doesn't exist gets the branded 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
