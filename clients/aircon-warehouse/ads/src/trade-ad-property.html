<!doctype html>
<html lang="en-NZ" class="feed">
<head>
<meta charset="utf-8">
<title>Trade ad: property managers</title>
<meta name="viewport" content="width=1080">
<script>
  /* Size switch: ?size=feed (1080x1350, default) | square (1080x1080) | story (1080x1920) */
  (function () {
    var s = new URLSearchParams(location.search).get('size');
    if (s === 'square' || s === 'story' || s === 'feed') document.documentElement.className = s;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Plus+Jakarta+Sans:wght@700;800&display=block" rel="stylesheet">
<link rel="stylesheet" href="ads.css">
<style>
/* Concept B: living room with the high-wall unit on the dark feature wall. */
html.feed   { --obj-pos: 66% 0%; --h1-fs: 88px; }
html.square { --obj-pos: 66% 0%; --h1-fs: 72px; }
html.story  { --obj-pos: 64% 0%; --h1-fs: 96px; --shade-solid: 28%; --shade-mid: 50%; --shade-end: 70%; }
</style>
</head>
<body>
<main class="ad">
  <div class="photo"><img src="img/living-room.jpg" alt="Modern living room with a wall-mounted heat pump"></div>
  <div class="shade"></div>
  <img class="motif" src="img/logo-mark.png" alt="">
  <img class="logo" src="img/logo-full-white.png" alt="Aircon Warehouse">
  <section class="copy">
    <span class="badge">Trade accounts &middot; Open 7 days</span>
    <h1>Heat pumps for your whole portfolio<span class="stop">.</span><br><span class="accent nowrap">One contact<span class="stop">.</span></span></h1>
    <p class="sub">Sized for the living room, installed around your tenants, paperwork for the tenancy file.</p>
    <div class="cta">
      <span class="btn">Apply for a trade account <span class="arrow">&rarr;</span></span>
      <span class="contact">09 215 9544<span class="dot">&middot;</span>airconwarehouse.co.nz</span>
    </div>
  </section>
</main>
</body>
</html>
