<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Bebas+Neue&display=swap">
<style>
:root{--red:#FC221C;--red2:#D81B15;--ink:#231F20;--w:#fff}
html,body{margin:0;background:#000}
.ad{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--ink);font-family:Archivo,Arial,sans-serif;color:var(--w)}
.ad.sq{height:1080px}
.ph{position:absolute;inset:0;background-size:cover;background-position:center}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,18,.55) 0%,rgba(20,18,18,.05) 28%,rgba(20,18,18,.18) 46%,rgba(20,18,18,.9) 76%,rgba(20,18,18,.97) 100%)}
.top{position:absolute;left:64px;right:64px;top:56px;display:flex;align-items:center;justify-content:space-between}
.logo{height:190px;width:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.sq .logo{height:160px}
.tag{font-weight:600;font-size:28px;letter-spacing:.06em;text-transform:uppercase;text-align:right;line-height:1.25;background:rgba(20,18,18,.62);padding:18px 26px;border-radius:12px;border-left:8px solid var(--red)}
.tag b{display:block;color:#fff;font-size:24px;letter-spacing:.14em;margin-top:4px}
.bot{position:absolute;left:64px;right:64px;bottom:64px}
.eye{display:flex;align-items:center;gap:16px;font-weight:700;font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:#fff;margin-bottom:22px}
.eye:before{content:"";width:56px;height:8px;background:var(--red)}
h1{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:150px;line-height:.9;margin:0 0 26px;letter-spacing:.005em;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.sq h1{font-size:122px}
.sub{font-size:40px;line-height:1.3;font-weight:500;max-width:900px;margin:0 0 40px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.sq .sub{font-size:34px;margin-bottom:32px}
.row{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.cta{background:var(--red2);color:#fff;font-weight:700;font-size:36px;padding:26px 44px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.sq .cta{font-size:32px;padding:22px 38px}
.ph-no{font-weight:600;font-size:32px;letter-spacing:.02em}
.sq .ph-no{font-size:28px}
.ph-no small{display:block;font-size:22px;font-weight:500;opacity:.85;letter-spacing:.04em}
.strip{position:absolute;left:0;right:0;bottom:0;height:14px;background:var(--red)}
</style></head><body>
<div class="ad" id="ad">
  <div class="ph" id="ph"></div><div class="shade"></div>
  <div class="top"><img class="logo" src="src/logo-750.png" alt="Smith Traders"><div class="tag">Truck &amp; machinery<br>brokers<b>NZ-wide</b></div></div>
  <div class="bot">
    <div class="eye" id="eye"></div>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="row"><div class="cta" id="cta"></div><div class="ph-no">027 253 0888<small>Sold on your behalf · Since 2011</small></div></div>
  </div>
  <div class="strip"></div>
</div>
<script>
const ADS={
 1:{ph:"src/digger.webp",eye:"Sell your truck or machine",h1:"Parked up and<br>still costing you?",sub:"Finance, insurance and depreciation don't stop when the machine does. We sell it on your behalf, NZ-wide.",cta:"Send the machine details"},
 2:{ph:"src/truck.webp",eye:"Keep working while it sells",h1:"Keep it earning<br>while we sell it",sub:"No yard. No auction. Stays on contract until it's sold, and Mitch finds the buyer.",cta:"Get a market appraisal"},
 3:{ph:"src/list3.jpg",eye:"Downsizing the fleet?",h1:"Don't fire-sale it<br>at auction",sub:"You set the price. Independent inspection. Buyers in NZ and across the Pacific.",cta:"Talk to Mitch"}
};
const q=new URLSearchParams(location.search); const a=ADS[q.get('ad')||1];
if(q.get('size')==='sq') document.getElementById('ad').classList.add('sq');
document.getElementById('ph').style.backgroundImage=`url(${a.ph})`;
document.getElementById('eye').textContent=a.eye; document.getElementById('h1').innerHTML=a.h1;
document.getElementById('sub').textContent=a.sub; document.getElementById('cta').textContent=a.cta;
</script></body></html>
