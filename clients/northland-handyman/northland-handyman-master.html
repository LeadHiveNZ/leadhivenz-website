.oncall .tag i{width:6px;height:6px;border-radius:50%;background:var(--live)}

.job{background:var(--card);border:1px solid var(--rule);border-radius:9px;padding:8px 12px;font-size:14px;color:var(--ink-2);font-weight:500}
.jobgroup{margin-bottom:14px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(244,246,249,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
