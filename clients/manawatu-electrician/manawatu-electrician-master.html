.quote{display:block;text-decoration:none;text-align:center;margin-top:10px;padding:15px;border-radius:14px;border:2px solid var(--ink);color:var(--ink);font-size:16.5px;font-weight:800;letter-spacing:-.2px;background:var(--card)}
.answered{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:11px;font-size:13.5px;color:var(--ink-2);font-weight:500}

.trust>div+div{border-left:1px solid var(--rule)}
.trust .v{font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.trust .l{font-size:11.5px;color:var(--ink-2);line-height:1.2;white-space:nowrap;font-weight:500}
.stars{color:#F2A900;font-size:13px;letter-spacing:.5px;line-height:1}
.price,.oncall,.cost{margin:14px 0 0;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:15px 16px;display:flex;gap:14px;align-items:center}

.price .amt small{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:0;display:block;margin-top:4px;white-space:normal}
.price p,.cost p{font-size:14px;color:var(--ink-2);line-height:1.4;flex:1}
.price p b,.cost p b{color:var(--ink);font-weight:700}
.face{width:54px;height:54px;border-radius:50%;flex:none;background:#E5EBF2;overflow:hidden;display:grid;place-items:center;font-weight:800;color:var(--ink-2);font-size:20px}
.face img{width:100%;height:100%;object-fit:cover}
.oncall .who{font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.oncall .what{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.oncall .tag{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:12px;font-weight:700;color:#0F6B3D;background:var(--live-bg);padding:3px 8px;border-radius:99px}
.oncall .tag i{width:6px;height:6px;border-radius:50%;background:var(--live)}
.h2{font-size:20px;font-weight:800;letter-spacing:-.5px;margin:34px 0 12px}
.points{list-style:none}
.points li{display:flex;gap:11px;align-items:flex-start;padding:10px 0;font-size:15.5px;border-bottom:1px solid var(--rule)}
.points li:last-child{border-bottom:0}
.tick{flex:none;width:21px;height:21px;border-radius:50%;background:var(--live-bg);display:grid;place-items:center;margin-top:1px}
.tick svg{width:11px;height:11px;stroke:var(--live);fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.jobs{display:flex;flex-wrap:wrap;gap:8px}
.job{background:var(--card);border:1px solid var(--rule);border-radius:9px;padding:8px 12px;font-size:14px;color:var(--ink-2);font-weight:500}
.jobgroup{margin-bottom:14px}
.jobgroup .g{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-bottom:7px;letter-spacing:.2px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--rule)}
.svc-intro{font-size:15.5px;line-height:1.5;max-width:60ch}
.steps{list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);counter-increment:s}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--mark);color:var(--mark-ink);font-size:13px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.steps b{display:block;font-size:15.5px;font-weight:700}
.steps span{display:block;font-size:14.5px;color:var(--ink-2);margin-top:2px;line-height:1.4}

.review p{font-size:15px;line-height:1.45}
.review .by{font-size:12.5px;color:var(--ink-3);margin-top:7px;font-weight:500}
.area{font-size:14.5px;color:var(--ink-2);line-height:1.6}
.area b{color:var(--ink);font-weight:700}
.faq details{border-bottom:1px solid var(--rule)}

.faq summary::after{content:"+";font-weight:600;color:var(--ink-3);font-size:20px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{padding:0 0 14px;font-size:14.5px;color:var(--ink-2);line-height:1.5}

.enquiry label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:10px 0 5px}
.enquiry input,.enquiry select,.enquiry textarea{width:100%;font:inherit;font-size:16px;padding:12px 13px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink)}

.footnav .t{font-size:13px;font-weight:700;margin-bottom:8px}
.footnav ul{list-style:none;columns:2;column-gap:16px}
.footnav li{font-size:14px;padding:4px 0;break-inside:avoid}

.foot{padding:16px 0 20px;font-size:12px;color:var(--ink-3);line-height:1.6}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(244,246,249,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
