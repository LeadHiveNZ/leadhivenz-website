<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Wellco Project Brain</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Wellco Developments project brain: stages, quotes, engagements, invoices, GST and year-end exports for each project company. Clickable demo.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wellco">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1E1B" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Josefin+Sans:wght@400;600;700&display=swap">
<style>
/* ===== Tokens =====
   Layout: mobile = sticky top bar + bottom tab bar; desktop (>=900px) = left sidebar + content column (max 1180px).
   Palette: Wellco monochrome (charcoal on warm white) + forest green accent, ocean teal secondary, sand fills. */
:root {
  --brand: #111111;
  --brand-ink: #FFFFFF;
  --accent: #1F4D2B;
  --accent-ink: #FFFFFF;
  --accent-2: #2E6F7A;
  --bg: #FAFAF7;
  --surface: #FFFFFF;
  --surface-2: #F4F3EF;
  --sand: #E8DFD0;
  --line: #E4E2DC;
  --line-strong: #D3D0C8;
  --ink: #111111;
  --ink-2: #3A3A38;
  --muted: #696969;
  --ok: #1F4D2B;
  --warn: #B7791F;
  --bad: #A93A3A;
  --ok-soft: #E3EEE5;
  --warn-soft: #F7ECD9;
  --bad-soft: #F6E2E0;
  --teal-soft: #E0EEF0;
  --scrim: rgba(17, 17, 17, 0.42);
  --shadow-1: 0 1px 2px rgba(17, 17, 17, 0.05), 0 1px 1px rgba(17, 17, 17, 0.03);
  --shadow-2: 0 2px 6px rgba(17, 17, 17, 0.06), 0 10px 24px rgba(17, 17, 17, 0.06);
  --shadow-3: 0 12px 40px rgba(17, 17, 17, 0.18);
  --focus: #2E6F7A;
  /* Chart tokens */
  --viz-paid: #1F4D2B;
  --viz-committed: #8DB59A;
  --viz-track: #ECE6DA;
  --viz-over: #A93A3A;
  /* Stage tokens (identity, used as dots/rails only) */
  --st1: #7A7468; --st2: #2E6F7A; --st3: #3E5C8A; --st4: #7B5E8E;
  --st5: #B7791F; --st6: #B4573A; --st7: #1F4D2B; --st8: #4F5B57;
  /* Type */
  --font-display: "Josefin Sans", "Avenir Next", "Century Gothic", "Trebuchet MS", sans-serif;
  --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fs-12: 0.75rem; --fs-13: 0.8125rem; --fs-14: 0.875rem; --fs-15: 0.9375rem;
  --fs-17: 1.0625rem; --fs-20: 1.25rem; --fs-24: 1.5rem; --fs-30: 1.875rem;
  /* Space (8px scale) */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r-sm: 8px; --r-md: 12px; --r-lg: 14px; --r-xl: 20px;
  --tabbar-h: 64px;
  --topbar-h: 60px;
  --sidebar-w: 248px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #F2F2EE; --brand-ink: #111111; --accent: #6FB383; --accent-ink: #0E1A12; --accent-2: #7FB7C2;
    --bg: #121412; --surface: #1B1E1B; --surface-2: #222622; --sand: #262A26;
    --line: #2C302C; --line-strong: #3A3F3A; --ink: #F2F2EE; --ink-2: #D6D8D2; --muted: #A2A69F;
    --ok: #6FB383; --warn: #E0A84E; --bad: #E07A72;
    --ok-soft: #1E2E22; --warn-soft: #33291A; --bad-soft: #3A2220; --teal-soft: #1C2D30;
    --scrim: rgba(0, 0, 0, 0.6);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow-2: 0 4px 16px rgba(0, 0, 0, 0.35); --shadow-3: 0 16px 48px rgba(0, 0, 0, 0.55);
    --focus: #7FB7C2;
    --viz-paid: #6FB383; --viz-committed: #3B6A49; --viz-track: #2A2F2A; --viz-over: #E07A72;
    --st1: #B3AC9E; --st2: #7FB7C2; --st3: #8FA8D6; --st4: #B79AC9; --st5: #E0A84E; --st6: #E08E6E; --st7: #6FB383; --st8: #A3B0AA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #F2F2EE; --brand-ink: #111111; --accent: #6FB383; --accent-ink: #0E1A12; --accent-2: #7FB7C2;
  --bg: #121412; --surface: #1B1E1B; --surface-2: #222622; --sand: #262A26;
  --line: #2C302C; --line-strong: #3A3F3A; --ink: #F2F2EE; --ink-2: #D6D8D2; --muted: #A2A69F;
  --ok: #6FB383; --warn: #E0A84E; --bad: #E07A72;
  --ok-soft: #1E2E22; --warn-soft: #33291A; --bad-soft: #3A2220; --teal-soft: #1C2D30;
  --scrim: rgba(0, 0, 0, 0.6);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4); --shadow-2: 0 4px 16px rgba(0, 0, 0, 0.35); --shadow-3: 0 16px 48px rgba(0, 0, 0, 0.55);
  --focus: #7FB7C2;
  --viz-paid: #6FB383; --viz-committed: #3B6A49; --viz-track: #2A2F2A; --viz-over: #E07A72;
  --st1: #B3AC9E; --st2: #7FB7C2; --st3: #8FA8D6; --st4: #B79AC9; --st5: #E0A84E; --st6: #E08E6E; --st7: #6FB383; --st8: #A3B0AA;
  color-scheme: dark;
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; padding-top: 0; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-15);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  overflow-x: hidden;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num, .money { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
main:focus { outline: none; }
.skip-link { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--brand); color: var(--brand-ink); padding: 10px 14px; border-radius: var(--r-sm); text-decoration: none; }
.skip-link:focus { top: 8px; }
.icon { width: 20px; height: 20px; flex: none; display: inline-block; vertical-align: middle; }
.icon-sm { width: 16px; height: 16px; }
.icon-lg { width: 24px; height: 24px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }

/* ===== Shell ===== */
.app { min-height: 100vh; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  height: var(--topbar-h);
  display: flex; align-items: center; gap: var(--s3);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar .brandlink { display: flex; align-items: center; text-decoration: none; min-width: 0; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: var(--s1); }
.logo-img { height: 34px; width: auto; display: block; }
.logo-fallback { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.logo-fallback .wm { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.08em; font-size: 15px; line-height: 1; }
.logo-fallback .wm small { display: block; font-weight: 400; font-size: 9px; letter-spacing: 0.24em; margin-top: 3px; color: var(--muted); }
:root[data-theme="dark"] .logo-img { filter: invert(1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-img { filter: invert(1); } }
.demo-pill {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
  border-radius: 999px; background: var(--teal-soft); color: var(--ink);
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
  border: 1px solid color-mix(in srgb, var(--accent-2) 30%, transparent);
}
.demo-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); }
.icon-btn {
  width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; background: transparent;
  border-radius: 12px; color: var(--ink); position: relative;
}
.icon-btn:hover { background: var(--surface-2); }
#bell { width: auto; padding: 0 8px; gap: 6px; display: inline-flex; align-items: center; text-decoration: none; }
#bell .dot { position: static; border: 0; }
.icon-btn .dot { position: absolute; top: 5px; right: 3px; min-width: 18px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; border: 2px solid var(--surface); box-sizing: content-box; }

.sidebar { display: none; }
.main { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-top: 1px solid var(--line);
}
.tabbar a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.01em; position: relative;
}
.tabbar a[aria-current="page"] { color: var(--ink); }
.tabbar a[aria-current="page"]::before { content: ""; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tabbar a .icon { width: 22px; height: 22px; }

@media (min-width: 900px) {
  body::before { display: none; }
  .topbar { display: none; }
  .tabbar { display: none; }
  .app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .sidebar {
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
    padding: 22px 14px 18px; border-right: 1px solid var(--line); background: var(--surface);
  }
  .sidebar .brandlink { display: block; padding: 4px 10px 20px; }
  .sidebar .logo-img { height: 58px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 2px; }
  .side-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 18px 12px 6px; }
  .sidebar nav a {
    display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 10px;
    text-decoration: none; color: var(--ink-2); font-weight: 500; font-size: var(--fs-14);
  }
  .sidebar nav a:hover { background: var(--surface-2); color: var(--ink); }
  .sidebar nav a[aria-current="page"] { background: var(--ok-soft); color: var(--ink); font-weight: 600; }
  .sidebar nav a[aria-current="page"] .icon { color: var(--accent); }
  .sidebar nav a .count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sidebar nav a .count.alert { background: var(--bad); color: #fff; border-radius: 999px; padding: 1px 8px; }
  .side-foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 12px 8px 0; border-top: 1px solid var(--line); }
  .side-foot .who { min-width: 0; flex: 1; line-height: 1.25; }
  .side-foot .who b { display: block; font-size: 13px; }
  .side-foot .who span { font-size: 12px; color: var(--muted); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--sand); color: var(--ink); font-weight: 700; font-size: 13px; flex: none; }
  .main { padding-bottom: 48px; min-width: 0; }
}

/* ===== Page ===== */
.page {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 8px;
}
@media (min-width: 900px) { .page { padding-left: 40px; padding-right: 40px; padding-block: 36px 24px; } }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--s3) var(--s4); margin-bottom: var(--s5); }
.page-head .titles { min-width: 0; flex: 1 1 260px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.page-title { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-30); line-height: 1.1; letter-spacing: 0.6px; padding-top: 4px; }
.page-sub { color: var(--muted); margin-top: 6px; font-size: var(--fs-14); }
.page-actions { display: flex; gap: var(--s2); flex-wrap: wrap; }
.section { margin-top: var(--s6); }
.section:first-child { margin-top: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); flex-wrap: wrap; }
.section-title { font-size: var(--fs-17); font-weight: 650; font-weight: 600; letter-spacing: -0.005em; display: flex; align-items: center; gap: 10px; }
.section-title .count { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.section-note { font-size: var(--fs-13); color: var(--muted); }
.back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: var(--fs-14); font-weight: 500; margin-bottom: 10px; min-height: 32px; }
.back-link:hover { color: var(--ink); }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); font-weight: 600; font-size: var(--fs-14);
  text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn-primary:hover { background: color-mix(in srgb, var(--brand) 86%, var(--surface)); }
.btn-accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-accent:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: var(--fs-13); border-radius: 10px; gap: 6px; }
.btn-sm .icon { width: 16px; height: 16px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent-2); font-weight: 600; font-size: var(--fs-13); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; min-height: 32px; }

/* ===== Cards & lists ===== */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.card-pad { padding: var(--s4); }
@media (min-width: 640px) { .card-pad { padding: 20px; } }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.row {
  display: flex; align-items: center; gap: var(--s3); padding: 14px var(--s4); min-height: 60px;
  text-decoration: none; color: inherit; background: transparent; width: 100%; border-left: 0; border-right: 0; border-bottom: 0; text-align: left;
}
.list > .row:first-child { border-top: 0; }
a.row:hover, button.row:hover { background: var(--surface-2); }
.row .body { min-width: 0; flex: 1; }
.row .title { font-weight: 600; font-size: var(--fs-15); line-height: 1.35; }
.row .meta { font-size: var(--fs-13); color: var(--muted); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.row .end { flex: none; display: flex; align-items: center; gap: var(--s2); text-align: right; }
.row .chev { color: var(--muted); }
.row-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--ink-2); }
.row-icon.bad { background: var(--bad-soft); color: var(--bad); }
.row-icon.warn { background: var(--warn-soft); color: var(--warn); }
.row-icon.ok { background: var(--ok-soft); color: var(--ok); }
.row-icon.teal { background: var(--teal-soft); color: var(--accent-2); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; font-size: var(--fs-14); }
.kv dt { color: var(--muted); white-space: nowrap; }
.kv dd { margin: 0; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.grid { display: grid; gap: var(--s4); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.muted { color: var(--muted); }
.small { font-size: var(--fs-13); }
.xs { font-size: var(--fs-12); }
.strong { font-weight: 600; }
.mono { font-family: var(--font-mono); font-size: 0.92em; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: var(--s3); }
.hstack { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.spacer { flex: 1; }
.divider { height: 1px; background: var(--line); margin: var(--s4) 0; border: 0; }

/* ===== Chips & pills ===== */
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line); line-height: 1;
}
.chip .d { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.chip.ok { background: var(--ok-soft); color: var(--ink); border-color: color-mix(in srgb, var(--ok) 25%, transparent); }
.chip.ok .d { background: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--ink); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.chip.warn .d { background: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--ink); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.chip.bad .d { background: var(--bad); }
.chip.teal { background: var(--teal-soft); color: var(--ink); border-color: color-mix(in srgb, var(--accent-2) 30%, transparent); }
.chip.teal .d { background: var(--accent-2); }
.chip.neutral .d { background: var(--muted); }
.chip.solid { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.chip .icon { width: 13px; height: 13px; }
.stage-chip { background: color-mix(in srgb, var(--stc) 12%, var(--surface)); border-color: color-mix(in srgb, var(--stc) 30%, transparent); color: var(--ink); }
.stage-chip .d { background: var(--stc); }
.gst-chip { height: 22px; font-size: 11px; padding: 0 8px; letter-spacing: 0.02em; }
.gst-taxable { background: var(--surface-2); }
.gst-taxable .d { background: var(--muted); }
.gst-gst_free { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.gst-gst_free .d { background: var(--warn); }
.gst-input_taxed { background: var(--teal-soft); border-color: color-mix(in srgb, var(--accent-2) 30%, transparent); }
.gst-input_taxed .d { background: var(--accent-2); }
.gst-margin_scheme { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 25%, transparent); }
.gst-margin_scheme .d { background: var(--ok); }

.chips-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips-scroll::-webkit-scrollbar { display: none; }
.filter-chip {
  flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink-2); font-weight: 500; font-size: var(--fs-13); display: inline-flex; align-items: center; gap: 6px;
}
.filter-chip[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.filter-chip .n { font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }

/* ===== Forms ===== */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .label { font-size: var(--fs-13); font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: var(--fs-12); color: var(--muted); }
.field .hint.gst-help { color: var(--ink-2); background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; display: flex; gap: 8px; align-items: flex-start; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); font-size: 16px; line-height: 1.35;
}
textarea.input { min-height: 96px; resize: vertical; }
select.input { appearance: none; -webkit-appearance: none; padding-right: 36px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.input:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: transparent; }
.form-grid { display: grid; gap: var(--s4); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 520px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.search { position: relative; }
.search .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .input { padding-left: 40px; }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: var(--fs-14); min-height: 44px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.line-item { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr) 130px 150px 36px; align-items: end; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
@media (max-width: 640px) { .line-item { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 44px; } .line-item .li-desc { grid-column: 1 / -1; } }

/* ===== Segmented / tabs ===== */
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-bottom: var(--s5); -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 46px; padding: 0 12px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: var(--fs-14); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs a .badge { min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; display: inline-grid; place-items: center; font-size: 11px; background: var(--bad); color: #fff; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg a, .seg button { flex: none; border: 0; background: transparent; height: 38px; padding: 0 14px; border-radius: 9px; font-weight: 600; font-size: var(--fs-13); color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.seg [aria-current="page"], .seg [aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* ===== Progress & bars ===== */
.meter { height: 6px; border-radius: 3px; background: var(--viz-track); overflow: hidden; }
.meter > span { display: block; height: 100%; border-radius: 3px; background: var(--accent); transform-origin: left; }
.spend { display: flex; gap: 2px; height: 10px; border-radius: 5px; background: var(--viz-track); position: relative; }
.spend > i { display: block; height: 100%; transform-origin: left; }
.spend > i:first-child { border-radius: 5px 0 0 5px; }
.spend > i:last-child { border-radius: 0 5px 5px 0; }
.spend > i:only-child { border-radius: 5px; }
.spend .paid { background: var(--viz-paid); }
.spend .committed { background: var(--viz-committed); }
.spend .over { background: var(--viz-over); }
.spend .rest { background: transparent; }
.spend.tall { height: 14px; border-radius: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--fs-12); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.animate .meter > span, .animate .spend > i { animation: grow .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ===== Stepper ===== */
.stepper-wrap { position: relative; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 4px; -webkit-overflow-scrolling: touch; }
.stepper-wrap::-webkit-scrollbar { display: none; }
@media (max-width: 899px) { .stepper-wrap { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%); } }
.stepper { display: grid; grid-template-columns: repeat(8, minmax(84px, 1fr)); gap: 4px; min-width: 700px; }
.step {
  position: relative; display: flex; flex-direction: column; gap: 8px; padding: 10px 10px 12px; border-radius: 12px; border: 1px solid transparent;
  text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.25; background: transparent; text-align: left;
}
.step:hover { background: var(--surface-2); }
.step .st-short { display: none; }
@media (max-width: 640px) { .step .st-long { display: none; } .step .st-short { display: inline; } }
.step .bar { height: 4px; border-radius: 2px; background: var(--sand); }
.step.done .bar { background: var(--accent); }
.step.current .bar { background: linear-gradient(90deg, var(--accent) var(--pct, 50%), var(--sand) var(--pct, 50%)); }
.step .n { white-space: nowrap; font-size: 11px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 4px; }
.step .n .icon { width: 13px; height: 13px; color: var(--accent); }
.step.done, .step.current { color: var(--ink); }
.step[aria-current="step"] { background: var(--surface); border-color: var(--line-strong); box-shadow: var(--shadow-1); }

/* ===== Project header ===== */
.proj-head { display: flex; flex-direction: column; gap: var(--s4); margin-bottom: var(--s4); }
.proj-id { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: var(--muted); }
.proj-name { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-30); line-height: 1.1; letter-spacing: 0.5px; padding-top: 4px; }
.proj-facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: var(--fs-13); color: var(--muted); }
.proj-facts span { display: inline-flex; align-items: center; gap: 6px; }
.proj-facts b { color: var(--ink-2); font-weight: 600; }

/* ===== Home ===== */
.greet { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-30); letter-spacing: 0.5px; line-height: 1.1; padding-top: 4px; }
.today-list .row { align-items: flex-start; }
.today-list .row .row-icon { margin-top: 2px; }
.today-group { padding: 10px var(--s4) 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.proj-card { display: flex; flex-direction: column; gap: 14px; padding: 18px; text-decoration: none; color: inherit; transition: box-shadow .2s, border-color .2s, transform .2s; }
.proj-card:hover { box-shadow: var(--shadow-2); border-color: var(--line-strong); }
.proj-card .top { display: flex; align-items: flex-start; gap: 12px; }
.proj-card .name { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-20); letter-spacing: 0.4px; line-height: 1.2; padding-top: 2px; }
.proj-card .co { font-size: var(--fs-13); color: var(--muted); margin-top: 2px; }
.proj-card .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fact .k { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.fact .v { font-size: var(--fs-14); font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.fact .v.bad { color: var(--bad); }
.spend-line { display: flex; justify-content: space-between; gap: 8px; font-size: var(--fs-12); color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.spend-line b { color: var(--ink); font-weight: 600; }
.closed-wrap summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 600; color: var(--muted); }
.closed-wrap summary::-webkit-details-marker { display: none; }
.closed-wrap summary .icon { transition: transform .2s; }
.closed-wrap[open] summary .icon { transform: rotate(90deg); }

.home-grid { display: block; }
@media (min-width: 1240px) {
  .home-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
  .home-grid .home-projects { margin-top: 0; }
  .home-grid .home-projects .grid-2 { grid-template-columns: minmax(0, 1fr); }
}
.icon.flip { transform: rotate(180deg); }
table.t th { white-space: normal; line-height: 1.25; vertical-align: bottom; }

/* ===== Tasks ===== */
.task { display: flex; align-items: flex-start; gap: 12px; padding: 12px var(--s4); }
.task.highlight, .flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { background: color-mix(in srgb, var(--accent-2) 16%, transparent); } 100% { background: transparent; } }
.check {
  width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid var(--line-strong); background: var(--surface);
  display: grid; place-items: center; flex: none; margin-top: 1px; color: transparent; padding: 0; position: relative;
}
.check::after { content: ""; position: absolute; inset: -9px; }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.check .icon { width: 16px; height: 16px; }
.task .t-title { font-weight: 500; line-height: 1.4; }
.task.done .t-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.task .t-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 6px; font-size: var(--fs-12); color: var(--muted); }
.due { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.due.over { color: var(--bad); font-weight: 600; }
.due.soon { color: var(--warn); font-weight: 600; }
.note { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: var(--fs-13); color: var(--ink-2); border-left: 3px solid var(--sand); }
.note .when { color: var(--muted); font-size: 11px; display: block; margin-bottom: 2px; }

/* ===== RFQ ===== */
.scope { padding: 0; overflow: hidden; }
.scope-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px var(--s4); flex-wrap: wrap; }
.scope-head .body { flex: 1 1 220px; min-width: 0; }
.scope-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.quote-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
.quote { background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; position: relative; }
.quote.appointed { background: color-mix(in srgb, var(--ok-soft) 70%, var(--surface)); }
.quote.lowest .amt::after { content: "Lowest"; margin-left: 8px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-2); vertical-align: middle; }
.quote .party { font-weight: 600; line-height: 1.3; }
.quote .amt { font-size: var(--fs-24); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.quote .amt small { font-size: var(--fs-12); font-weight: 500; color: var(--muted); letter-spacing: 0; }
.quote ul { margin: 0; padding-left: 18px; font-size: var(--fs-13); color: var(--ink-2); }
.quote .lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.quote .q-actions { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; padding-top: 4px; }
.quote.empty-slot { color: var(--muted); align-items: flex-start; justify-content: center; background: repeating-linear-gradient(135deg, var(--surface), var(--surface) 8px, var(--surface-2) 8px, var(--surface-2) 16px); }
.compare-toggle { display: none; width: 100%; border: 0; border-top: 1px solid var(--line); background: var(--surface-2); min-height: 44px; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: var(--fs-13); color: var(--accent-2); }
.scope.show-all .compare-toggle .icon { transform: rotate(180deg); }
@media (max-width: 640px) {
  .scope.done:not(.show-all) .quote.declined-q { display: none; }
  .compare-toggle { display: flex; }
  .proj-name, .page-title, .greet { font-size: 26px; }
  .proj-head { gap: 12px; }
  .proj-facts { font-size: 12px; gap: 4px 14px; }
  .stepper { grid-template-columns: repeat(8, minmax(74px, 1fr)); min-width: 610px; }
  .step { padding: 8px 8px 10px; gap: 6px; font-size: 11.5px; }
  .page-head { margin-bottom: 20px; }
  .seg.seg-fill { display: grid; width: 100%; overflow: visible; }
  .seg.seg-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .seg.seg-fy { grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); }
  .seg.seg-fill > * { justify-content: center; }
  .totals .v { font-size: var(--fs-17); }
  .toolbar > .seg-fill { flex: 1 1 100%; }
}
.reason { padding: 12px var(--s4); background: var(--ok-soft); font-size: var(--fs-13); display: flex; gap: 8px; align-items: flex-start; border-top: 1px solid var(--line); }
.reason .icon { color: var(--ok); margin-top: 1px; }

/* ===== Money rows ===== */
.inv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 14px var(--s4); align-items: start; }
.inv .l1 { font-weight: 600; line-height: 1.35; }
.inv .l2 { font-size: var(--fs-13); color: var(--muted); margin-top: 2px; }
.inv .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.inv .amt { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: var(--fs-15); white-space: nowrap; }
.inv .amt small { display: block; font-size: var(--fs-12); font-weight: 500; color: var(--muted); }
.inv .acts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.inv .lines { grid-column: 1 / -1; font-size: var(--fs-13); border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 8px; display: grid; gap: 4px; }
.inv .lines div { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-2); }
.inv .lines div span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; margin-bottom: var(--s4); }
.totals > div { background: var(--surface); padding: 14px 16px; }
.totals .k { font-size: var(--fs-12); color: var(--muted); font-weight: 500; }
.totals .v { font-size: var(--fs-20); font-weight: 600; margin-top: 2px; letter-spacing: -0.01em; }
.totals .v.big { font-family: var(--font-display); letter-spacing: 0.3px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); margin-bottom: var(--s4); }
.toolbar .spacer { flex: 1; }

/* Budget */
.bva { display: grid; grid-template-columns: minmax(0, 1fr); }
.bva-row { padding: 14px var(--s4); display: grid; gap: 8px; }
.bva-row.over { background: color-mix(in srgb, var(--bad-soft) 60%, var(--surface)); }
.bva-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.bva-top .cat { font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.bva-nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; font-size: var(--fs-13); font-variant-numeric: tabular-nums; }
.bva-nums .k { color: var(--muted); font-size: 11px; display: block; }
.bva-nums b { font-weight: 600; }
.bva-nums .bad { color: var(--bad); }
@media (max-width: 520px) { .bva-nums { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Tables */
.table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-1); -webkit-overflow-scrolling: touch; }
table.t { width: 100%; border-collapse: collapse; font-size: var(--fs-14); font-variant-numeric: tabular-nums; }
table.t th, table.t td { padding: 12px 14px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
table.t th { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
table.t th:first-child { background: var(--surface-2); }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.total td { font-weight: 700; background: var(--surface-2); }
table.t td.neg { color: var(--ok); }
table.t td.pos { color: var(--ink); }
table.t tr.current td:first-child::after { content: "Current"; margin-left: 8px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-2); }

/* ===== Documents ===== */
.docs { display: grid; gap: var(--s4); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .docs { grid-template-columns: 240px minmax(0, 1fr); } }
.folders { padding: 8px; display: flex; flex-direction: column; gap: 2px; }
@media (max-width: 899px) { .folders { flex-direction: row; overflow-x: auto; scrollbar-width: none; padding: 6px; } .folders::-webkit-scrollbar { display: none; } }
.folder { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 9px; border: 0; background: transparent; font-weight: 500; font-size: var(--fs-14); color: var(--ink-2); text-align: left; flex: none; }
.folder:hover { background: var(--surface-2); }
.folder[aria-pressed="true"] { background: var(--ok-soft); color: var(--ink); font-weight: 600; }
.folder[aria-pressed="true"] .icon { color: var(--accent); }
.folder .n { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-left: 8px; }
.files { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.file { padding: 14px; display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.file .fi { width: 38px; height: 46px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: end center; padding-bottom: 6px; font-size: 9px; font-weight: 800; letter-spacing: .05em; color: var(--bad); flex: none; position: relative; }
.file .fi::before { content: ""; position: absolute; top: -1px; right: -1px; width: 12px; height: 12px; background: linear-gradient(225deg, var(--bg) 50%, var(--line-strong) 50%); border-bottom-left-radius: 3px; }
.file .fn { font-family: var(--font-mono); font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; color: var(--ink); }
.file .fm { font-size: var(--fs-12); color: var(--muted); margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* ===== Log ===== */
.log { position: relative; padding: 6px 0; }
.log-item { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 10px var(--s4); position: relative; }
.log-item::before { content: ""; position: absolute; left: calc(var(--s4) + 17px); top: 46px; bottom: -10px; width: 2px; background: var(--line); }
.log-item:last-child::before { display: none; }
.log-item .when { font-size: var(--fs-12); color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }

/* ===== Contacts / deals ===== */
.contact { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; text-align: left; border: 1px solid var(--line); width: 100%; background: var(--surface); }
.contact:hover { border-color: var(--line-strong); box-shadow: var(--shadow-2); }
.contact .top { display: flex; gap: 12px; align-items: flex-start; }
.contact .initials { width: 40px; height: 40px; border-radius: 12px; background: var(--sand); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; color: var(--ink); }
.contact .nm { font-weight: 600; line-height: 1.3; }
.contact .cm { font-size: var(--fs-13); color: var(--muted); }
.contact .proj-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.stars { color: var(--warn); letter-spacing: 1px; font-size: 13px; }
.deal { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.deal .addr { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-20); letter-spacing: 0.4px; line-height: 1.2; padding-top: 2px; }
.deal-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
.feaso { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: var(--fs-13); }

/* ===== Sheet / drawer ===== */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 80; opacity: 0; transition: opacity .22s ease; }
.scrim.open { opacity: 1; }
.sheet {
  position: fixed; z-index: 90; left: 0; right: 0; bottom: 0; max-height: 92vh; max-height: 92dvh;
  display: flex; flex-direction: column; background: var(--surface); color: var(--ink);
  border-radius: 20px 20px 0 0; box-shadow: var(--shadow-3);
  transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.open { transform: translateY(0); }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 8px auto 0; flex: none; }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 20px 12px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); flex: none; }
.sheet-head .titles { flex: 1; min-width: 0; }
.sheet-title { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-20); letter-spacing: 0.4px; line-height: 1.2; padding-top: 6px; }
.sheet-sub { font-size: var(--fs-13); color: var(--muted); margin-top: 4px; }
.sheet-body { padding: 20px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-foot { display: flex; gap: 8px; padding: 12px 20px 16px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); flex: none; flex-wrap: wrap; background: var(--surface); }
.sheet-foot .btn { flex: 1 1 auto; }
.sheet-foot .btn-primary, .sheet-foot .btn-accent { flex: 2 1 160px; }
@media (min-width: 900px) {
  .sheet { left: auto; top: 0; bottom: 0; right: 0; width: 520px; max-height: none; border-radius: 0; transform: translateX(100%); padding-bottom: 0; }
  .sheet.open { transform: translateX(0); }
  .sheet-grip { display: none; }
  .sheet-head { padding-top: 22px; }
}
.demo-banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--teal-soft); font-size: var(--fs-13); color: var(--ink); margin-bottom: 16px; border: 1px solid color-mix(in srgb, var(--accent-2) 25%, transparent); }
.demo-banner .icon { color: var(--accent-2); }
.email { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.email-meta { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 6px 10px; padding: 12px 14px; font-size: var(--fs-13); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.email-meta dt { color: var(--muted); }
.email-meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.email-body { padding: 14px; font-size: var(--fs-14); white-space: pre-wrap; line-height: 1.55; color: var(--ink); overflow-wrap: anywhere; }
textarea.email-body { width: 100%; border: 0; min-height: 300px; background: var(--surface); resize: vertical; font-family: inherit; }
.attach { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-top: 1px solid var(--line); }
.attach div { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }
.attach .icon { color: var(--muted); flex: none; }
.recips { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.recip { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; min-height: 52px; }
.recip input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.recip .body { min-width: 0; flex: 1; overflow-wrap: anywhere; }
.recip .body .chip { margin-top: 6px; }
.recip:has(input:checked) { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: color-mix(in srgb, var(--ok-soft) 50%, var(--surface)); }
.po { border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: var(--surface); }
.po-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding-bottom: 12px; border-bottom: 2px solid var(--ink); margin-bottom: 12px; flex-wrap: wrap; }
.po-party { text-align: right; }
@media (max-width: 520px) { .po-party { text-align: left; } }
.po-head .doc { font-family: var(--font-display); font-weight: 700; letter-spacing: 1px; font-size: var(--fs-17); text-transform: uppercase; padding-top: 3px; }
.reason-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.wizard-steps { display: flex; gap: 8px; margin-bottom: var(--s5); }
.wizard-steps div { flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-12); font-weight: 600; color: var(--muted); }
.wizard-steps div::before { content: ""; height: 4px; border-radius: 2px; background: var(--sand); }
.wizard-steps div.on { color: var(--ink); }
.wizard-steps div.on::before { background: var(--accent); }
.create-list { display: grid; gap: 10px; }
.create-list div { display: flex; gap: 10px; align-items: flex-start; font-size: var(--fs-14); }
.create-list .icon { color: var(--accent); margin-top: 2px; }

/* Welcome */
.welcome-logo { display: block; height: 96px; width: auto; margin: 4px 0 18px; }
.try { display: grid; gap: 10px; margin-top: 16px; }
.try a, .try button { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; text-align: left; color: var(--ink); }
.try a:hover, .try button:hover { background: var(--surface-2); }
.try .n { width: 28px; height: 28px; border-radius: 50%; background: var(--sand); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }

/* Toast */
.toasts { position: fixed; z-index: 120; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 10px); display: flex; flex-direction: column; gap: 8px; width: min(440px, calc(100vw - 32px)); pointer-events: none; }
@media (min-width: 900px) { .toasts { top: auto; bottom: 24px; left: auto; right: 24px; transform: none; } body.sheet-open .toasts { right: 544px; } }
.toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--brand); color: var(--brand-ink); box-shadow: var(--shadow-3); font-size: var(--fs-14); font-weight: 500; animation: toastIn .25s ease-out; }
.toast .icon { flex: none; margin-top: 1px; }
@keyframes toastIn { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Tooltip */
.tip { position: fixed; z-index: 130; pointer-events: none; background: var(--brand); color: var(--brand-ink); padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; box-shadow: var(--shadow-2); max-width: 240px; font-variant-numeric: tabular-nums; }

/* Empty */
.empty { padding: 32px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .icon { width: 28px; height: 28px; color: var(--line-strong); }
.empty b { color: var(--ink); }

/* More menu */
.more-list .row { min-height: 64px; }

/* Settings */
.status-grid { display: grid; gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.status-grid > div { background: var(--surface); padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; font-size: var(--fs-14); flex-wrap: wrap; }
.status-grid .k { color: var(--muted); }
.status-grid .v { font-weight: 600; display: inline-flex; gap: 8px; align-items: center; text-align: right; overflow-wrap: anywhere; }
.ok-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; box-shadow: 0 0 0 3px var(--ok-soft); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}
@media (forced-colors: active) { .check[aria-checked="true"] { forced-color-adjust: none; } }

/* ===== GST maths ===== */
// Line amounts: taxable = ex GST; gst_free / input_taxed = total; margin_scheme = sale price (GST-inclusive on the margin).
function lineGst(l) {
  if (l.gst === 'taxable') return round2(l.amount * 0.1);
  if (l.gst === 'margin_scheme') return l.atSettlement ? 0 : round2(Math.max(0, l.amount - (l.marginBase || 0)) / 11);
  return 0;
}
function lineTotal(l) { return l.gst === 'taxable' ? round2(l.amount * 1.1) : l.amount; }
function lineEx(l) { return round2(lineTotal(l) - lineGst(l)); }
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
function invEx(i) { return round2(sum(i.lines, lineEx)); }
function invGst(i) { return round2(sum(i.lines, lineGst)); }
function invTotal(i) { return round2(sum(i.lines, lineTotal)); }
function lineTotalSum(lines) { return sum(lines, lineTotal); }
function invGstFree(i) { return round2(sum(i.lines.filter(l => l.gst === 'gst_free'), lineTotal)); }
function totalText(i) { return fmtMoney(invTotal(i)) + (invGst(i) ? ' inc GST' : ' (no GST)'); }
function invTreatments(i) { return [...new Set(i.lines.map(l => l.gst))]; }
function gstChip(t) { return `<span class="chip gst-chip gst-${t}"><span class="d"></span>${h(GST_TYPES[t] ? GST_TYPES[t].label : t)}</span>`; }

function projectMoney(p) {
  const cats = {}; CATEGORIES.forEach(c => { cats[c] = { budget: (p.budget || {})[c] || 0, committed: 0, paid: 0 }; });
  const ensure = (c) => cats[c] || (cats[c] = { budget: 0, committed: 0, paid: 0 });
  (p.engagements || []).forEach(e => {
    const linked = sum(p.invoicesIn.filter(i => i.engagementId === e.id), invEx);
    ensure(e.category).committed += Math.max(e.value || 0, linked);
  });
  (p.invoicesIn || []).forEach(i => {
    const ex = invEx(i);
    if (!i.engagementId || !(p.engagements || []).some(e => e.id === i.engagementId)) ensure(i.category).committed += ex;
    if (i.status === 'paid') ensure(i.category).paid += ex;
  });
  const tot = { budget: 0, committed: 0, paid: 0 };
  Object.values(cats).forEach(c => { c.committed = round2(c.committed); c.paid = round2(c.paid); tot.budget += c.budget; tot.committed += c.committed; tot.paid += c.paid; });
  if (p.status === 'closed' && p.spent) { tot.budget = p.budgetTotal; tot.committed = p.spent; tot.paid = p.spent; }
  return { cats, tot };
}
function openTasks(p) { return p.tasks.filter(t => !t.done); }
function overdueTasks(p) { return openTasks(p).filter(t => t.due && t.due < TODAY); }
function nextDeadline(p) { return openTasks(p).filter(t => t.due >= TODAY).sort((a, b) => a.due.localeCompare(b.due))[0]; }

function quoteAge(q) { return q.requestedAt ? daysBetween(q.requestedAt, TODAY) : 0; }

const NEED_GROUPS = { approval: 'Approvals waiting', overdue: 'Overdue', quote: 'Quotes outstanding over 7 days', due: 'Invoices due this week', lead: 'Lead-time warnings' };

function basQuarter(p, fy, q) {
  const r = quarterRange(fy, q);
  const ins = p.invoicesIn.filter(i => i.status !== 'draft' && inRange(i.date, r));
  const outs = (p.invoicesOut || []).filter(o => o.status !== 'draft' && inRange(o.date, r));
  const sales = round2(sum(outs, o => sum(o.lines.filter(l => !l.atSettlement), lineTotal)));
  const deposits = round2(sum(outs, o => sum(o.lines.filter(l => l.atSettlement), lineTotal)));
  const gstSales = round2(sum(outs, invGst));
  const purchases = round2(sum(ins, invTotal));
  const credits = round2(sum(ins, invGst));
  const gstFree = round2(sum(ins, invGstFree));
  const inputTaxed = round2(sum(ins, i => sum(i.lines.filter(l => l.gst === 'input_taxed'), lineTotal)));
  return { fy, q, label: QUARTERS[q - 1].label, range: r, sales, deposits, gstSales, purchases, credits, gstFree, inputTaxed, net: round2(gstSales - credits), ins, outs };
}
function projectFYs(p) {
  const dates = [p.started, ...p.invoicesIn.map(i => i.date), ...(p.invoicesOut || []).map(o => o.date)].filter(Boolean);
  const first = fyStartYear(dates.sort()[0] || TODAY); const last = fyStartYear(p.status === 'closed' ? (p.closed || TODAY) : TODAY);
  const out = []; for (let y = first; y <= last; y++) out.push(fyLabel(y)); return out;
}

}

function spendBar(m, opts = {}) {
  const { budget, committed, paid } = m;
  const scale = Math.max(budget, committed, 1);
  const paidW = (paid / scale) * 100;
  const commW = (Math.max(0, Math.min(committed, budget) - paid) / scale) * 100;
  const overW = committed > budget && budget > 0 ? ((committed - Math.max(budget, paid)) / scale) * 100 : 0;
  const tip = (k, v) => `data-tip="${h(k + ': ' + fmtMoney(v) + ' ex GST')}" tabindex="0"`;
  const label = `Budget ${fmtMoney(budget)}, committed ${fmtMoney(committed)}, paid ${fmtMoney(paid)}, all ex GST`;
  return `<div class="spend ${opts.tall ? 'tall' : ''}" role="img" aria-label="${h(label)}">
    ${paidW > 0 ? `<i class="paid" style="width:${paidW.toFixed(2)}%" ${tip('Paid', paid)}></i>` : ''}
    ${commW > 0.2 ? `<i class="committed" style="width:${commW.toFixed(2)}%" ${tip('Committed, not yet paid', Math.max(0, Math.min(committed, budget) - paid))}></i>` : ''}
    ${overW > 0.2 ? `<i class="over" style="width:${overW.toFixed(2)}%" ${tip('Over budget', committed - budget)}></i>` : ''}
  </div>`;
}

/* ===== View: Project ===== */
const PROJECT_TABS = [['stage', 'Stage & tasks'], ['rfqs', 'RFQs & quotes'], ['engagements', 'Engagements'], ['money', 'Money'], ['documents', 'Documents'], ['log', 'Log']];
function viewProject() {
  const p = getProject(route.parts[0]);
  if (!p) return `<div class="page">${emptyState('folder', 'Project not found', 'It may have been removed when the demo data was reset.', '<a class="btn" href="#/projects">All projects</a>')}</div>`;
  const tab = PROJECT_TABS.some(t => t[0] === route.parts[1]) ? route.parts[1] : 'stage';
  const selStage = tab === 'stage' ? Math.min(8, Math.max(1, +route.parts[2] || p.stage)) : p.stage;
  const approvals = p.invoicesIn.filter(i => i.status === 'draft').length + (p.invoicesOut || []).filter(o => o.status === 'draft').length;
  const awaitingEng = p.engagements.filter(e => e.status === 'awaiting' || e.status === 'draft').length;
  const outstandingQ = p.rfqs.reduce((a, r) => a + r.quotes.filter(q => q.status === 'requested').length, 0);
  const steps = STAGES.map(s => {
    const sp = stageProgress(p, s.n); const done = p.status === 'closed' || s.n < p.stage; const cur = p.status !== 'closed' && s.n === p.stage;
    return `<a class="step ${done ? 'done' : ''} ${cur ? 'current' : ''}" href="#/project/${p.id}/stage/${s.n}" ${tab === 'stage' && s.n === selStage ? 'aria-current="step"' : ''} style="--pct:${Math.round(sp.pct * 100)}%" aria-label="Stage ${s.n}: ${h(s.name)}${done ? ', complete' : cur ? ', current' : ''}">
      <span class="bar"></span><span class="n">${done ? icon('check') : ''}Stage ${s.n}</span><span class="st-long">${h(s.name)}</span><span class="st-short" aria-hidden="true">${h(s.short)}</span></a>`;
  }).join('');
  const badge = (n) => n ? `<span class="badge" aria-label="${n} waiting">${n}</span>` : '';
  const tabs = PROJECT_TABS.map(([k, label]) => `<a href="#/project/${p.id}/${k}" ${k === tab ? 'aria-current="page"' : ''}>${label}${k === 'money' ? badge(approvals) : k === 'engagements' ? badge(awaitingEng) : k === 'rfqs' ? badge(outstandingQ) : k === 'stage' ? badge(overdueTasks(p).length) : ''}</a>`).join('');
  const body = { stage: () => tabStage(p, selStage), rfqs: () => tabRfqs(p), engagements: () => tabEngagements(p), money: () => tabMoney(p), documents: () => tabDocuments(p), log: () => tabLog(p) }[tab]();
  return `<div class="page">
    <a class="back-link" href="#/projects">${icon('chevron-left', 'icon-sm')}All projects</a>
    <div class="proj-head">
      <div><div class="proj-id">${h(p.id)} · ${h(p.lotPlan)}, ${h(p.street)}, ${h(p.suburb)} ${h(p.state)}</div>
      <h1 class="proj-name">${h(p.name)}</h1></div>
      <div class="proj-facts"><span>${icon('building', 'icon-sm')}<b>${h(p.company.name)}</b> ABN ${h(p.company.abn)}</span><span>${icon('map', 'icon-sm')}${h(p.type)} · ${h(p.yield)}</span><span>${icon('receipt', 'icon-sm')}${p.company.gst ? 'GST registered' : 'Not GST registered'}</span>${p.status === 'closed' ? `<span class="chip neutral"><span class="d"></span>Closed ${fmtDate(p.closed)}</span>` : ''}</div>
    </div>
    <div class="card" style="padding:6px;margin-bottom:var(--s4)"><div class="stepper-wrap"><nav class="stepper" aria-label="Project stages">${steps}</nav></div></div>
    <nav class="tabs" aria-label="Project sections">${tabs}</nav>
    ${body}
  </div>`;
}

function tabStage(p, n) {
  const s = stageInfo(n); const sp = stageProgress(p, n);
  const tasks = p.tasks.filter(t => t.stage === n).sort((a, b) => (a.done - b.done) || (a.due || '').localeCompare(b.due || ''));
  const isCur = p.status !== 'closed' && n === p.stage; const isDone = p.status === 'closed' || n < p.stage;
  const status = isCur ? '<span class="chip teal"><span class="d"></span>Current stage</span>' : isDone ? '<span class="chip ok"><span class="d"></span>Complete</span>' : '<span class="chip neutral"><span class="d"></span>Upcoming</span>';
  const list = tasks.map(t => {
    const rd = relDue(t.due, t.done);
    return `<div class="task ${t.done ? 'done' : ''}" data-id="${t.id}">
      <button class="check" role="checkbox" aria-checked="${t.done}" data-action="toggle-task" data-p="${p.id}" data-id="${t.id}" aria-label="${t.done ? 'Mark not done' : 'Mark done'}: ${h(t.title)}">${icon('check')}</button>
      <div style="min-width:0;flex:1"><div class="t-title">${h(t.title)}</div>
        <div class="t-meta"><span class="due ${rd.cls}">${icon('calendar', 'icon-sm')}${h(rd.text)}</span>${t.lead && !t.done ? `<span class="chip warn">${icon('warning')}Lead time</span>` : ''}<button class="link-btn" data-action="add-note" data-p="${p.id}" data-id="${t.id}">Add note</button></div>
        ${t.lead && !t.done ? `<div class="note" style="border-left-color:var(--warn)">${h(t.lead)}</div>` : ''}
        ${(t.notes || []).map(nt => `<div class="note"><span class="when">${h(fmtDateTime(nt.ts))}</span>${h(nt.text)}</div>`).join('')}
      </div></div>`;
  }).join('');
  return `<div class="card">
    <div class="card-pad" style="display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-start;border-bottom:1px solid var(--line)">
      <div style="flex:1 1 240px;min-width:0"><div class="hstack" style="margin-bottom:6px">${stageChip(n, 'Stage ' + n)}${status}</div><h2 class="section-title" style="font-size:var(--fs-20)">${h(s.name)}</h2>
        ${isCur && p.stageNote ? `<p class="small muted" style="margin-top:4px">${h(p.stageNote)}</p>` : ''}
        <p class="xs muted num" style="margin-top:8px">${sp.done} of ${sp.total} tasks done</p></div>
      <div class="hstack"><button class="btn btn-sm" data-action="add-task" data-p="${p.id}" data-stage="${n}">${icon('plus')}Add task</button>${isCur && n < 8 ? `<button class="btn btn-sm" data-action="advance-stage" data-p="${p.id}">Move to stage ${n + 1}${icon('chevron')}</button>` : ''}</div>
    </div>
    <div class="list" style="border:0;box-shadow:none;border-radius:0 0 var(--r-lg) var(--r-lg)">${list || emptyState('list', 'No tasks in this stage', 'Add the first task for ' + s.name + '.')}</div>
  </div>`;
}

function tabRfqs(p) {
  const isOpen = (r) => !r.quotes.some(q => q.status === 'appointed');
  const scopes = p.rfqs.slice().sort((a, b) => (isOpen(b) - isOpen(a)) || (b.stage - a.stage));
  return `<div class="toolbar"><p class="small muted" style="flex:1 1 260px">Minimum 3 quotes per scope, same template every time. Contracts are with ${h(p.company.name)}.</p>
    <button class="btn btn-sm" data-action="new-scope" data-p="${p.id}">${icon('plus')}New scope</button></div>
    <div class="stack" style="gap:var(--s4)">${scopes.length ? scopes.map(r => scopeCard(p, r)).join('') : `<div class="card">${emptyState('mail', 'No scopes yet', 'Create a scope, then request three quotes from the contacts register.')}</div>`}</div>`;
}
function scopeCard(p, r) {
  const received = r.quotes.filter(q => q.amount != null);
  const min = received.length > 1 ? Math.min(...received.map(q => q.amount)) : null;
  const appointedQ = r.quotes.find(q => q.status === 'appointed');
  const statusTxt = appointedQ ? `<span class="chip ok">${icon('check')}Appointed: ${h(contactLabel(appointedQ.contactId))}</span>` : `<span class="chip ${received.length >= 3 ? 'teal' : 'warn'}"><span class="d"></span>${received.length} of 3 quotes in</span>`;
  const cards = r.quotes.map(q => {
    const age = quoteAge(q);
    return `<div class="quote ${q.status === 'appointed' ? 'appointed' : ''} ${q.status === 'declined' ? 'declined-q' : ''} ${min != null && q.amount === min && !appointedQ ? 'lowest' : ''}" data-id="${q.id}">
      <div class="hstack" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap"><div style="min-width:0"><div class="party">${h(contactLabel(q.contactId))}</div><div class="xs muted">${h(contactPerson(q.contactId))}</div></div>${statusChip(q.status)}</div>
      ${q.amount != null ? `<div><div class="amt">${fmtMoney(q.amount)} <small>ex GST</small></div><div class="xs muted">${fmtMoney(q.gst === 'taxable' ? q.amount * 1.1 : q.amount)} inc GST · received ${fmtDateShort(q.received)}</div></div>` : `<div><div class="amt muted" style="font-size:var(--fs-17)">Waiting on quote</div><div class="xs ${age > 7 ? '' : 'muted'}" style="${age > 7 ? 'color:var(--bad);font-weight:600' : ''}">Requested ${fmtDateShort(q.requestedAt)} · ${plural(age, 'day')} ago</div></div>`}
      ${q.inclusions && q.inclusions.length ? `<div><div class="lbl">Includes</div><ul>${q.inclusions.map(x => `<li>${h(x)}</li>`).join('')}</ul></div>` : ''}
      ${q.exclusions && q.exclusions.length ? `<div><div class="lbl">Excludes</div><ul>${q.exclusions.map(x => `<li>${h(x)}</li>`).join('')}</ul></div>` : ''}
      <div class="q-actions">
        ${q.status === 'requested' ? `<button class="btn btn-sm" data-action="chase" data-p="${p.id}" data-r="${r.id}" data-id="${q.id}">${icon('mail')}Chase</button><button class="btn btn-sm btn-ghost" data-action="add-quote" data-p="${p.id}" data-r="${r.id}" data-c="${q.contactId}">Log quote</button>` : ''}
        ${q.status === 'received' && !appointedQ ? `<button class="btn btn-sm btn-accent" data-action="appoint" data-p="${p.id}" data-r="${r.id}" data-id="${q.id}">${icon('check')}Appoint</button>` : ''}
      </div></div>`;
  });
  const missing = 3 - r.quotes.length;
  if (missing > 0 && !appointedQ) cards.push(`<div class="quote empty-slot"><div class="lbl">${missing === 3 ? 'No quotes yet' : plural(missing, 'more quote')} to reach 3</div><div class="small">${r.quotes.length ? 'Pick more parties from the contacts register.' : 'Request quotes from three parties using your template.'}</div><button class="btn btn-sm" data-action="request-quote" data-p="${p.id}" data-r="${r.id}">${icon('send')}Request quote${missing > 1 ? 's' : ''}</button></div>`);
  const declinedN = r.quotes.filter(q => q.status === 'declined').length;
  return `<article class="card scope ${appointedQ ? 'done' : ''}" data-id="${r.id}">
    <div class="scope-head"><div class="body"><div class="hstack" style="margin-bottom:6px">${stageChip(r.stage, 'Stage ' + r.stage)}<span class="chip">${h(r.category)}</span>${statusTxt}</div><h3 class="section-title">${h(r.scope)}</h3></div>
      <div class="actions"><button class="btn btn-sm" data-action="add-quote" data-p="${p.id}" data-r="${r.id}">${icon('plus')}Add quote</button>${appointedQ ? '' : `<button class="btn btn-sm btn-primary" data-action="request-quote" data-p="${p.id}" data-r="${r.id}">${icon('send')}Request quote</button>`}</div></div>
    <div class="quote-grid">${cards.join('')}</div>
    ${appointedQ && declinedN ? `<button type="button" class="compare-toggle" data-action="toggle-compare" aria-expanded="false">${icon('chevron-down', 'icon-sm')}<span>Compare with ${plural(declinedN, 'other quote')}</span></button>` : ''}
    ${r.appointed ? `<div class="reason">${icon('check')}<div><b>Why ${h(contactLabel(appointedQ ? appointedQ.contactId : ''))}:</b> ${h(r.appointed.reason)} <span class="muted">· ${fmtDate(r.appointed.date)}</span></div></div>` : ''}
  </article>`;
}

function tabEngagements(p) {
  const es = p.engagements.slice().sort((a, b) => (a.status === 'complete') - (b.status === 'complete') || (b.issued || '9').localeCompare(a.issued || '9'));
  const total = sum(es, e => e.value);
  return `<div class="toolbar"><p class="small muted" style="flex:1 1 260px">Engagement letters and purchase orders, all issued in the name of <b style="color:var(--ink)">${h(p.company.name)}</b>. ${fmtMoney(total)} ex GST engaged.</p></div>
  <div class="list">${es.length ? es.map(e => {
    const claimed = sum(p.invoicesIn.filter(i => i.engagementId === e.id && i.status !== 'draft'), invEx);
    const pct = e.value ? Math.min(100, (claimed / e.value) * 100) : 0;
    return `<div class="inv" data-id="${e.id}" style="grid-template-columns:minmax(0,1fr) auto">
      <div><div class="l1">${h(contactLabel(e.contactId))}</div><div class="l2">${h(e.scope)} · ${h(e.category)}${e.issued ? ' · issued ' + fmtDateShort(e.issued) : ''}</div>

      ${e.value ? `<div style="grid-column:1/-1;margin-top:6px"><div class="meter" role="img" aria-label="${Math.round(pct)}% claimed"><span style="width:${pct.toFixed(1)}%"></span></div></div>` : ''}
      ${e.status === 'awaiting' || e.status === 'draft' ? `<div class="acts"><button class="btn btn-sm btn-primary" data-action="issue-po" data-p="${p.id}" data-id="${e.id}">${icon('send')}Review and issue PO</button></div>` : e.status === 'issued' ? `<div class="acts"><button class="btn btn-sm btn-ghost" data-action="complete-eng" data-p="${p.id}" data-id="${e.id}">${icon('check')}Mark complete</button></div>` : ''}
    </div>`; }).join('') : emptyState('handshake', 'No engagements yet', 'Appoint a quote in RFQs & quotes to create one.')}</div>`;

/* Money */
const MONEY_TABS = [['in', 'Invoices in'], ['out', 'Invoices out'], ['budget', 'Budget vs actual'], ['gst', 'GST / BAS']];
function tabMoney(p) {

let ui = { fyIn: 'all', fyGst: null, docFolder: 'all', contactRole: 'All', contactQ: '', expFY: {} };
function fyFilter(p, key) {

function invRow(p, i, dir) {
  const party = dir === 'in' ? contactLabel(i.contactId) : i.to;
  const lines = i.lines.length > 1 || i.lines.some(l => l.atSettlement) ? `<div class="lines">${i.lines.map(l => `<div><span>${h(l.desc)} ${gstChip(l.gst)}</span><span>${fmtMoney(lineTotal(l))}</span></div>`).join('')}${i.lines.some(l => l.atSettlement) ? '<div class="muted"><span>GST on this deposit is attributed at settlement (margin scheme)</span><span></span></div>' : ''}</div>` : '';
  const eng = i.engagementId ? p.engagements.find(e => e.id === i.engagementId) : null;
  let acts = '';
  if (dir === 'in') {
    if (i.status === 'draft') acts = `<button class="btn btn-sm btn-primary" data-action="approve-invoice" data-p="${p.id}" data-id="${i.id}">${icon('shield')}Review and approve</button>`;
    else if (i.status === 'approved') acts = `<button class="btn btn-sm btn-accent" data-action="pay-invoice" data-p="${p.id}" data-id="${i.id}">${icon('check')}Mark paid</button>`;
  } else {
    if (i.status === 'draft') acts = `<button class="btn btn-sm btn-primary" data-action="issue-invoice" data-p="${p.id}" data-id="${i.id}">${icon('send')}Review and issue</button>`;
    else if (i.status === 'issued') acts = `<button class="btn btn-sm btn-accent" data-action="receive-invoice" data-p="${p.id}" data-id="${i.id}">${icon('check')}Mark received</button>`;
  }
  const due = (i.status === 'approved' || i.status === 'draft' || i.status === 'issued') && i.due ? relDue(i.due) : null;
  return `<div class="inv" data-id="${i.id}">

  if (routeChanged) {

/* ===== Theme ===== */
function currentThemeChoice() { try { return localStorage.getItem(THEME_KEY) || 'system'; } catch (e) { return document.documentElement.getAttribute('data-theme') || 'system'; } }
function effectiveDark() { const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme(choice, persist = true) {
  if (choice === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', choice);
  if (persist) { try { if (choice === 'system') localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, choice); } catch (e) { /* ignore */ } }
}

/* ===== Toasts & tooltip ===== */
function toast(msg, ic = 'check') {
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = icon(ic) + `<span>${h(msg)}</span>`;

    else if (kind === 'contacts') { name = downloadBook(`WELLCO_ContactsRegister_${TODAY}.xlsx`, [{ name: 'Contacts', rows: [['Company', 'Contact', 'Role', 'ABN', 'Email', 'Phone', 'Licence expiry', 'Insurance expiry', 'Projects', 'Notes'], ...state.contacts.map(c => [c.company, c.name, c.role, c.abn, c.email, c.phone, c.licenceExpiry || '', c.insuranceExpiry || '', contactProjects(c.id).map(x => x.id).join(', '), c.notes])] }]); }
  } catch (err) { console.warn(err); toast('Export failed. Try again.', 'warning'); return; }
  if (p && label) { addLog(p, `${label} exported for the accountant`, 'doc'); save(); }

}

      <div class="try">
        <button type="button" data-action="welcome-go" data-href="#/project/CROOBYAR/money/in${claim ? '?f=' + claim.id : ''}"><span class="n">1</span><span><b>Approve a progress claim</b><br><span class="small muted">Southcoast Civil's claim #6 on Croobyar</span></span></button>
        <button type="button" data-action="welcome-go" data-href="#/project/CROOBYAR/rfqs"><span class="n">2</span><span><b>Send an RFQ</b><br><span class="small muted">Landscaping quotes from your template</span></span></button>
        <button type="button" data-action="welcome-go" data-href="#/exports"><span class="n">3</span><span><b>Download a year-end workbook</b><br><span class="small muted">The Excel file your accountant gets for FY2025-26</span></span></button>
      </div>`,
    foot: `<button type="button" class="btn btn-primary btn-block" data-action="welcome-close">Have a look around</button>` });
}

/* ===== Events ===== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = ACTIONS[el.dataset.action]; if (!fn) return;
  if (el.tagName === 'A' && el.dataset.action === 'close-sheet') { closeSheet(); return; }
  e.preventDefault(); fn(el, e);
});
document.addEventListener('submit', (e) => { const f = e.target; const fn = FORMS[f.dataset.form]; if (fn) { e.preventDefault(); fn(f, new FormData(f)); } });
document.addEventListener('input', (e) => {
  const el = e.target; const k = el.dataset && el.dataset.input; if (!k) return;
  if (k === 'contact-search') { ui.contactQ = el.value; const html = viewContacts(); const tmp = document.createElement('div'); tmp.innerHTML = html; $('#contact-grid').replaceWith(tmp.querySelector('#contact-grid')); }
  if (k === 'inv-calc') updateInvoiceCalc();
  if (k === 'upload-preview') updateUploadPreview();
  if (k === 'wiz-suburb' && wiz) { const idEl = $('#w-id'); if (idEl && (!idEl.value || idEl.dataset.auto)) { idEl.value = el.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); idEl.dataset.auto = '1'; } }
});
document.addEventListener('change', (e) => {
  const el = e.target; const k = el.dataset && el.dataset.input; if (!k) return;
  if (k === 'exp-fy') { ui.expFY[el.dataset.p] = el.value; render(); const s = $('#fy-' + CSS.escape(el.dataset.p)); if (s) s.focus(); }
  if (k === 'inv-calc') updateInvoiceCalc();
  if (k === 'upload-preview') updateUploadPreview();
  if (k === 'rfq-rcpt') {
    const p = getProject(el.dataset.p); const r = findRfq(p, el.dataset.r);
    sheetPicked = [...document.querySelectorAll('#sheet input[name=rcpt]:checked')].map(x => x.value);
    const btn = $('#sheet [data-action="sheet-approve"]'); if (btn) btn.disabled = !sheetPicked.length;
    if (sheetPicked.length) { const cid = sheetPicked[0]; $('#sheet [data-email-to]').innerHTML = recipientLine(cid, sheetPicked.length - 1); const body = $('#sheet [data-email-body]'); if (body && body.tagName !== 'TEXTAREA') body.textContent = rfqBody(p, r, cid); const att = $('#sheet .attach'); if (att) att.innerHTML = rfqAttachments(p, r, cid).map(a => `<div>${icon('file', 'icon-sm')}${h(a)}</div>`).join(''); }
  }
});
$('#file-input').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0]; if (!file || !sheetCtx) return;
  sheetCtx.file = { name: file.name, size: file.size };
  const lbl = $('#u-file'); if (lbl) lbl.textContent = `${file.name} · ${Math.max(1, Math.round(file.size / 1024))} KB`;
  updateUploadPreview();
});
document.addEventListener('keydown', (e) => {
  if (sheetEl.hidden) return;
  if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
  if (e.key === 'Tab') {
    const f = [...sheetEl.querySelectorAll('a[href], button:not([disabled]), input:not([type=hidden]), select, textarea, [tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
scrimEl.addEventListener('click', closeSheet);
document.addEventListener('mouseover', (e) => { const t = e.target.closest('[data-tip]'); if (t) showTip(t); else if (!tipEl.hidden) hideTip(); });
document.addEventListener('focusin', (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); else hideTip(); });
window.addEventListener('scroll', hideTip, { passive: true });
window.addEventListener('hashchange', () => { if (!sheetEl.hidden) closeSheet(); render(true); });
if (IN_ARTIFACT) document.addEventListener('click', (e) => { const a = e.target.closest && e.target.closest('a[href^="#/"]'); if (a) { e.preventDefault(); go(a.getAttribute('href')); } }, true);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => renderNav());

/* ===== Boot ===== */
(function boot() {
  const t = currentThemeChoice(); if (t !== 'system') applyTheme(t, false);
  mountLogos();
  if (!IN_ARTIFACT && !location.hash) history.replaceState(null, '', '#/home');
  render(true);
  if (!state.welcomed) setTimeout(openWelcome, 400);
})();
</script>
</body>
</html>
