<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap">
<style>
/* ===== Tokens =====
   Shopify Polaris admin, light theme only (@shopify/polaris-tokens 9.4.2, @shopify/polaris 13.9.5). Xero wording on money screens.
   Layout: phone (<768px) = 56px dark top bar + bottom tab bar, tables stack into rows, cards edge to edge below 490px.
   Desktop (>=768px) = Polaris frame: fixed 56px top bar + 240px nav, page content on #F1F1F1. */
:root {
  color-scheme: light;
  --bg: #F1F1F1; --surface: #FFFFFF; --surface-hover: #F7F7F7; --surface-selected: #F1F1F1;
  --surface-secondary: #F7F7F7; --surface-tertiary: #F3F3F3;
  --nav-bg: #EBEBEB; --nav-hover: #F1F1F1; --nav-selected: #FFFFFF;
  --topbar-bg: #1A1A1A; --topbar-text: #E3E3E3;
  --border: #E3E3E3; --border-secondary: #EBEBEB; --border-strong: #CCCCCC;
  --input-border: #8A8A8A; --input-border-hover: #616161; --input-border-active: #1A1A1A; --input-bg: #FDFDFD;
  --text: #303030; --text-secondary: #616161; --text-disabled: #B5B5B5; --link: #005BD3; --link-hover: #004299;
  --icon: #4A4A4A; --icon-secondary: #8A8A8A;
  --primary: #303030; --primary-hover: #1A1A1A; --on-primary: #FFFFFF; --focus: #005BD3;
  --badge-neutral-bg: rgba(0, 0, 0, .06); --badge-neutral-text: #616161;
  --fill-hover: rgba(0, 0, 0, .05); --fill-selected: rgba(0, 0, 0, .08);
  --success: #047B5D; --success-bg: #AFFEBF; --success-text: #014B40; --success-surface: #CDFED4; --success-border: #92FCAC;
  --warning: #FFB800; --warning-bg: #FFD6A4; --warning-text: #5E4200; --warning-text-2: #956F00; --warning-surface: #FFF1E3; --warning-border: #FFC879;
  --attention-bg: #FFEB78; --attention-text: #4F4700; --attention-surface: #FFF8DB;
  --critical: #C70A24; --critical-hover: #A30A24; --critical-bg: #FED1D7; --critical-text: #8E0B21; --critical-surface: #FEE8EB; --critical-border: #FEC1C7; --critical-icon: #E22C38;
  --info-bg: #D5EBFF; --info-text: #003A5A; --info-text-2: #007CB4; --info-surface: #EAF4FF; --info-border: #A8D8FF; --info-icon: #0094D5;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'San Francisco', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
  --fw-regular: 450; --fw-medium: 550; --fw-semibold: 650; --fw-bold: 700;
  --r-card: 12px; --r-control: 8px; --r-modal: 16px;
  --shadow-100: 0 1px 0 0 rgba(26, 26, 26, .07);
  --shadow-300: 0 4px 6px -2px rgba(26, 26, 26, .20);
  --shadow-400: 0 8px 16px -4px rgba(26, 26, 26, .22);
  --shadow-600: 0 20px 20px -8px rgba(26, 26, 26, .28);
  --bevel: 1px 0 0 0 rgba(0, 0, 0, .13) inset, -1px 0 0 0 rgba(0, 0, 0, .13) inset, 0 -1px 0 0 rgba(0, 0, 0, .17) inset, 0 1px 0 0 rgba(204, 204, 204, .5) inset;
  --shadow-button: 0 -1px 0 0 #B5B5B5 inset, 0 0 0 1px rgba(0, 0, 0, .1) inset, 0 .5px 0 1.5px #FFF inset;
  --shadow-button-hover: 0 1px 0 0 #EBEBEB inset, -1px 0 0 0 #EBEBEB inset, 1px 0 0 0 #EBEBEB inset, 0 -1px 0 0 #CCC inset;
  --shadow-button-primary: 0 -1px 0 1px rgba(0, 0, 0, .8) inset, 0 0 0 1px rgba(48, 48, 48, 1) inset, 0 .5px 0 1.5px rgba(255, 255, 255, .25) inset;
  --shadow-button-primary-hover: 0 1px 0 0 rgba(255, 255, 255, .24) inset, 1px 0 0 0 rgba(255, 255, 255, .2) inset, -1px 0 0 0 rgba(255, 255, 255, .2) inset, 0 -1px 0 0 #000 inset, 0 -1px 0 1px #1A1A1A;
  --shadow-button-critical: 0 -1px 0 1px rgba(142, 31, 11, .8) inset, 0 0 0 1px rgba(181, 38, 11, .8) inset, 0 .5px 0 1.5px rgba(255, 255, 255, .349) inset;
  --shadow-inset-200: 0 2px 1px 0 rgba(26, 26, 26, .2) inset, 1px 0 1px 0 rgba(26, 26, 26, .12) inset, -1px 0 1px 0 rgba(26, 26, 26, .12) inset;
  --sheen: linear-gradient(180deg, rgba(48, 48, 48, 0) 63.53%, rgba(255, 255, 255, .15) 100%);
  --nav-w: 240px; --topbar-h: 56px; --tabbar-h: 56px; --page-max: 998px; --page-narrow: 662px;
  /* Type scale (desktop). The phone values come from Polaris' p-theme-light-mobile theme, below. */
  --fs-body: 13px; --lh-body: 20px; --fs-sm: 12px; --lh-sm: 16px; --fs-xs: 11px; --lh-xs: 12px;
  --fs-hsm: 13px; --fs-hmd: 14px; --lh-hmd: 20px; --fs-hlg: 20px; --lh-hlg: 24px; --fs-hxl: 20px;
  --fs-input: 13px; --btn-h: 28px; --btn-micro-h: 24px; --ctl-h: 32px; --tab-h: 28px; --card-gap: 16px;
  /* Bars: neutral greys, red only when over budget */
  --viz-paid: #4A4A4A; --viz-committed: #B5B5B5; --viz-track: #EBEBEB; --viz-over: #C70A24;
  /* Aliases still referenced by inline styles in drawer templates */
  --ink: var(--text); --ink-2: var(--text); --muted: var(--text-secondary); --line: var(--border); --line-strong: var(--border-strong);
  --surface-2: var(--surface-secondary); --accent: var(--primary); --ok: var(--success); --warn: var(--warning-text-2); --bad: var(--critical);
  --ok-soft: var(--success-surface); --warn-soft: var(--warning-surface); --bad-soft: var(--critical-surface); --teal-soft: var(--info-surface);
  --scrim: rgba(0, 0, 0, .71);
}
@media (max-width: 767px) {
  :root {
    --fs-body: 16px; --lh-body: 24px; --fs-sm: 14px; --lh-sm: 20px; --fs-xs: 12px; --lh-xs: 16px;
    --fs-hsm: 14px; --fs-hmd: 16px; --lh-hmd: 20px; --fs-hlg: 18px; --lh-hlg: 24px; --fs-hxl: 22px;
    --fs-input: 16px; --btn-h: 32px; --btn-micro-h: 28px; --ctl-h: 36px; --tab-h: 36px; --card-gap: 8px;
  }
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
body {
  background: #F1F1F1;
  color: var(--text);
  font-family: var(--font);
  font-weight: var(--fw-regular);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { margin: 0; font-size: inherit; font-weight: inherit; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
.num, .money { font-variant-numeric: tabular-nums lining-nums; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
main:focus { outline: none; }
.skip-link { position: absolute; left: 8px; top: -60px; z-index: 200; background: var(--surface); color: var(--text); padding: 8px 12px; border-radius: var(--r-control); box-shadow: var(--shadow-300); }
.skip-link:focus { top: 8px; }
.icon { width: 20px; height: 20px; flex: none; display: inline-block; vertical-align: middle; stroke-width: 1.6; }
.icon-sm { width: 16px; height: 16px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--topbar-bg); }

/* ===== Frame: top bar ===== */
.app { min-height: 100vh; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 12px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--topbar-bg); color: var(--topbar-text);
  box-shadow: var(--shadow-100);
}
.tb-left { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
.brandlink { display: inline-flex; align-items: center; gap: 10px; min-width: 0; height: 40px; padding: 0 8px 0 6px; border-radius: var(--r-control); color: var(--topbar-text); }
.brandlink:hover { background: rgba(255, 255, 255, .08); }
.brandmark { display: block; position: relative; flex: none; width: 63px; height: 28px; overflow: hidden; }
.brandmark .logo-img { position: absolute; left: -29px; top: -2px; height: 52px; width: auto; max-width: none; filter: brightness(0) invert(1); }
.brandmark .logo-fallback { color: #FFFFFF; }
.brandname { font-size: 13px; line-height: 20px; font-weight: var(--fw-medium); color: var(--topbar-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-search { display: none; position: relative; }
.tb-search .icon { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #B5B5B5; pointer-events: none; }
.tb-search input {
  width: 100%; height: 32px; border: 0; border-radius: var(--r-control); padding: 0 12px 0 32px;
  background: rgba(255, 255, 255, .11); color: #FFFFFF; font-size: 13px; line-height: 20px; outline-offset: 1px;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .08) inset;
}
.tb-search input::placeholder { color: #B5B5B5; }
.tb-search input:hover { background: rgba(255, 255, 255, .16); }
.tb-search input:focus { background: #FFFFFF; color: var(--text); outline: 2px solid var(--focus); }
.tb-search input:focus::placeholder { color: var(--text-secondary); }
.tb-search input::-webkit-search-cancel-button { display: none; }
.tb-right { flex: none; display: flex; align-items: center; gap: 8px; margin-left: auto; }
.tb-user { font-size: 13px; line-height: 20px; color: var(--topbar-text); white-space: nowrap; }
.tb-user .tb-demo { color: #B5B5B5; }
.tb-user .tb-name { font-weight: var(--fw-medium); }
.avatar { width: 28px; height: 28px; border-radius: var(--r-control); display: grid; place-items: center; background: #4A4A4A; color: #FFFFFF; font-weight: var(--fw-semibold); font-size: 12px; line-height: 1; flex: none; }
@media (max-width: 767px) {
  .tb-user .tb-name, .tb-user .tb-sep { display: none; }
  .tb-user { font-size: 13px; }
}

/* ===== Frame: navigation ===== */
.sidebar { display: none; }
.main { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px); }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  background: #FFFFFF; border-top: 1px solid #E3E3E3;
}
.tabbar a {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--text-secondary); font-size: 13px; line-height: 16px; font-weight: var(--fw-regular);
}
.tabbar a .icon { width: 22px; height: 22px; }
.tabbar a[aria-current="page"] { color: #303030; font-weight: var(--fw-medium); }
.tabbar a[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 22%; right: 22%; height: 2px; background: #303030; }

@media (min-width: 768px) {
  body::before { display: none; }
  .topbar { position: fixed; top: 0; left: 0; right: 0; display: grid; grid-template-columns: minmax(240px, 1fr) minmax(auto, 480px) 1fr; gap: 24px; padding: 0 16px 0 max(10px, env(safe-area-inset-left, 0px)); }
  .tb-search { display: block; }
  .topbar .tb-right { justify-self: end; margin-left: 0; }
  .tabbar { display: none; }
  .sidebar {
    display: flex; flex-direction: column; position: fixed; z-index: 30; left: 0; top: var(--topbar-h); bottom: 0; width: var(--nav-w);
    padding: 16px 8px 12px max(8px, env(safe-area-inset-left, 0px)); background: var(--nav-bg); overflow-y: auto;
  }
  .main { margin-left: var(--nav-w); padding-top: var(--topbar-h); padding-bottom: 48px; min-width: 0; }
}
#side-nav { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.nav-main { display: flex; flex-direction: column; gap: 2px; }
.nav-foot { margin-top: auto; padding-top: 16px; display: flex; flex-direction: column; }
.nav-item, .nav-sub {
  display: flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 4px 0 8px; border-radius: var(--r-control);
  color: var(--text); font-size: 13px; line-height: 20px; font-weight: var(--fw-regular);
}
.nav-item .icon { width: 20px; height: 20px; color: var(--icon); }
.nav-item .nav-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item:hover, .nav-sub:hover { background: var(--nav-hover); }
.nav-item[aria-current="page"] { background: #FFFFFF; font-weight: var(--fw-medium); box-shadow: var(--shadow-100); }
.nav-item[aria-current="page"] .icon { color: var(--text); }
.nav-item.is-parent { font-weight: var(--fw-medium); }
.nav-count { font-size: 12px; line-height: 16px; color: var(--text-secondary); padding-right: 4px; font-variant-numeric: tabular-nums; }
.nav-sub { padding-left: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; line-height: 28px; }
.nav-sub[aria-current="page"] { background: #FFFFFF; font-weight: var(--fw-medium); box-shadow: var(--shadow-100); }

/* ===== Page ===== */
.page {
  max-width: calc(var(--page-max) + 48px); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: 16px;
}
.page.page-full { max-width: none; }
.page.page-narrow { max-width: calc(var(--page-narrow) + 48px); }
@media (min-width: 768px) { .page { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); } }
@media (min-width: 1440px) { .page.page-full { max-width: 1440px; } }
.page-header { padding: 16px 0; }
@media (min-width: 768px) { .page-header { padding: 24px 0 20px; } }
.ph-row { display: flex; align-items: flex-start; gap: 8px 12px; flex-wrap: wrap; }
.ph-back { margin: -2px 0 0 -4px; }
.ph-titles { flex: 1 1 260px; min-width: 0; }
.ph-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-height: 28px; }
.page-title { font-size: var(--fs-hlg); line-height: var(--lh-hlg); font-weight: var(--fw-bold); letter-spacing: -0.2px; color: var(--text); }
.page-sub { margin-top: 4px; font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--text-secondary); }
.ph-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
@media (max-width: 767px) { .ph-row { flex-wrap: nowrap; } .ph-titles { flex: 1 1 0; } .ph-actions { flex: none; } }
.page-tabs { margin: -4px 0 16px; }
.proj-tabs { padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.tnum { font-variant-numeric: tabular-nums lining-nums; }
.section-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
.section-bar .grow { flex: 1 1 260px; min-width: 0; }
.stack-cards { display: flex; flex-direction: column; gap: var(--card-gap); }
.layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1040px) { .layout { grid-template-columns: minmax(0, 2fr) minmax(240px, 320px); } }
.layout > div { display: flex; flex-direction: column; gap: var(--card-gap); min-width: 0; }
.help { font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--text-secondary); }
.help-below { margin-top: 8px; }
@media (max-width: 489px) { .help-below { padding: 0 2px; } }

/* ===== Cards ===== */
.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-100), var(--bevel); overflow: clip; min-width: 0; }
.card-pad { padding: 16px; }
.card-head { display: flex; align-items: flex-start; gap: 8px 12px; flex-wrap: wrap; padding: 16px 16px 8px; }
.card-head.solo { padding-bottom: 16px; }
.card-head .ch-titles { flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; }
.card-head .ch-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.card-title { font-size: var(--fs-hmd); line-height: var(--lh-hmd); font-weight: var(--fw-semibold); color: var(--text); }
.card-sub { font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--text-secondary); padding: 0 16px 12px; margin-top: -4px; }
.card-head .card-sub { padding: 0; margin: -6px 0 0; flex-basis: 100%; }
.card-section { padding: 16px; }
.card-section + .card-section { border-top: 1px solid var(--border); }
.card-footer { background: var(--surface-secondary); border-top: 1px solid var(--border); padding: 12px 16px; font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--text-secondary); }
.card-footer b { color: var(--text); font-weight: var(--fw-medium); }
.card .empty { padding: 40px 16px; }
@media (max-width: 489px) {
  .main .page .card { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); border-radius: 0; box-shadow: 0 0 0 1px var(--border-secondary); }
}

/* ===== Tabs (Polaris Tabs / IndexFilters) ===== */
.ptabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.ptabs::-webkit-scrollbar { display: none; }
.card > .ptabs { padding: 6px 8px; border-bottom: 1px solid var(--border-secondary); }
.ptab {
  position: relative; flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: var(--tab-h); padding: 4px 12px;
  border: 0; border-radius: var(--r-control); background: transparent; color: #4A4A4A;
  font-size: 13px; line-height: 20px; font-weight: var(--fw-medium); white-space: nowrap;
}
.ptab:hover { background: var(--fill-hover); color: var(--text); }
.ptab[aria-current="page"], .ptab[aria-pressed="true"] { background: var(--fill-selected); color: var(--text); }
.ptab .ptab-n { color: var(--text-secondary); font-weight: var(--fw-regular); font-variant-numeric: tabular-nums; }
.ptab .badge { margin-left: 0; }
@media (max-width: 767px) {
  .ptab { font-size: 14px; }
  .ptab::after { content: ""; position: absolute; inset: -4px 0; }
  .page-tabs { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding: 4px max(12px, env(safe-area-inset-left, 0px)); }
}

/* ===== Index tables ===== */
.filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; border-bottom: 1px solid var(--border-secondary); }
.filterbar .grow { flex: 1 1 220px; min-width: 0; }
.filterbar .count-text { color: var(--text-secondary); font-size: var(--fs-sm); line-height: var(--lh-sm); }
.itable-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.itable { width: 100%; border-collapse: collapse; font-size: var(--fs-body); line-height: var(--lh-body); }
.itable th {
  background: var(--surface-secondary); color: var(--text-secondary); font-size: 12px; line-height: 20px; font-weight: var(--fw-medium);
  text-align: left; padding: 8px 6px; white-space: nowrap; border-bottom: 1px solid var(--border-secondary); vertical-align: bottom;
}
.itable td { padding: 6px; text-align: left; vertical-align: top; border-top: 1px solid var(--border-secondary); }
.itable tbody tr:first-child td { border-top: 0; }
.itable th:first-child, .itable td:first-child { padding-left: 12px; }
.itable th:last-child, .itable td:last-child { padding-right: 12px; }
.itable td { padding-top: 6px; padding-bottom: 6px; }
.itable .num, .itable th.num { text-align: right; font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
.itable .nowrap { white-space: nowrap; }
.itable tbody tr { position: relative; background: var(--surface); }
.itable tbody tr.clickable { cursor: pointer; }
.itable tbody tr.clickable:hover { background: var(--surface-hover); }
.itable .strong, .itable .c-id { font-weight: var(--fw-medium); color: var(--text); }
.itable .sub { color: var(--text-secondary); font-size: var(--fs-sm); line-height: var(--lh-sm); margin-top: 1px; }

/* ===== Summary strip (Xero-style figures, not KPI cards) ===== */

/* ===== Badges ===== */

}

@media (max-width: 767px) {
  .btn::after { content: ""; position: absolute; inset: -6px -2px; }

/* ===== Stage tab ===== */

  display: grid; place-items: center; flex: none; margin-top: 1px; color: transparent; padding: 0;
}

@media (max-width: 899px) { .annotated + .annotated { border-top: 0; padding-top: 8px; } }

@media (max-width: 767px) { .export-row .select-inline { width: 100%; } .export-row .select-inline select.input { flex: 1; min-height: 36px; } .bas-pair select.input { min-height: 36px; } }

/* ===== Sheet: drawer (desktop right panel), bottom sheet (phone), modal ===== */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 80; opacity: 0; transition: opacity .2s ease; }
.scrim.open { opacity: 1; }
body:has(.sheet .is-modal) .scrim { background: var(--scrim); }
.sheet {
  position: fixed; z-index: 90; left: 0; right: 0; bottom: 0; max-height: 92vh; max-height: 92dvh;
  display: flex; flex-direction: column; background: var(--surface); color: var(--text);
  border-radius: 12px 12px 0 0; box-shadow: var(--shadow-600); border-top: 1px solid var(--border);
  transform: translateY(100%); transition: transform .25s cubic-bezier(.2, .8, .2, 1), opacity .2s ease;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.open { transform: translateY(0); }
.sheet-grip { display: none; }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--border); flex: none; }
.sheet-head .titles { flex: 1; min-width: 0; padding-top: 4px; }
.sheet-title { font-size: var(--fs-hmd); line-height: var(--lh-hmd); font-weight: var(--fw-semibold); }
.sheet-sub { font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--text-secondary); margin-top: 2px; }
.sheet-body { padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-body > p + p { margin-top: 12px; }
.sheet-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--border); background: var(--surface-secondary); flex: none; flex-wrap: wrap; }
@media (max-width: 767px) { .sheet-foot .btn { flex: 1 1 auto; min-height: 44px; font-size: 15px; } .sheet-foot .btn::after { display: none; } }
@media (min-width: 768px) {
  .sheet { left: auto; top: 0; bottom: 0; right: 0; width: 520px; max-height: none; border-radius: 0; border-top: 0; border-left: 1px solid var(--border); box-shadow: var(--shadow-600); transform: translateX(100%); padding-bottom: 0; }
  .sheet.open { transform: translateX(0); }
  .sheet:has(.is-modal) {
    top: 50%; left: 50%; right: auto; bottom: auto; width: min(620px, calc(100vw - 48px)); max-height: calc(100vh - 60px);
    border-radius: var(--r-modal); border: 0; overflow: hidden; transform: translate(-50%, -48%); opacity: 0;
  }
  .sheet.open:has(.is-modal) { transform: translate(-50%, -50%); opacity: 1; }
  .sheet:has(.is-modal) .sheet-head { padding: 16px; }
}

.email-meta { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 12px; padding: 10px 12px; margin: 0; font-size: var(--fs-sm); line-height: var(--lh-sm); border-bottom: 1px solid var(--border); background: var(--surface-secondary); }
.email-meta dt { color: var(--text-secondary); }
.email-meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; color: var(--text); }

.attach { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-top: 1px solid var(--border); }
.attach div { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; line-height: 18px; color: var(--text); min-width: 0; overflow-wrap: anywhere; }

.po-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px; flex-wrap: wrap; }
.po-party { text-align: right; }
@media (max-width: 520px) { .po-party { text-align: left; } }

.po .kv { grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; }
.po .kv dt { font-size: var(--fs-body); line-height: var(--lh-body); }

.reason-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.filter-chip { position: relative; display: inline-flex; align-items: center; min-height: 28px; padding: 2px 10px; border-radius: var(--r-control); border: 1px dashed var(--border-strong); background: var(--surface); color: var(--text); font-size: var(--fs-sm); line-height: 16px; }
.filter-chip:hover { background: var(--surface-hover); }
.eyebrow { font-size: var(--fs-hsm); line-height: 20px; font-weight: var(--fw-semibold); color: var(--text); margin-bottom: 6px; padding: 0; }
.create-list { display: grid; gap: 8px; }
.create-list div { display: flex; gap: 8px; align-items: flex-start; }
.create-list .icon { color: var(--icon); width: 16px; height: 16px; margin-top: 2px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-control); background: var(--surface); }

.list { border: 1px solid var(--border); border-radius: var(--r-control); overflow: hidden; background: var(--surface); }
.list > * + * { border-top: 1px solid var(--border-secondary); }
.row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; min-height: 44px; width: 100%; border: 0; background: transparent; text-align: left; color: inherit; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.grid { display: grid; gap: 16px; }
.muted { color: var(--text-secondary); }
.small { font-size: var(--fs-sm); line-height: var(--lh-sm); }

.toasts { position: fixed; z-index: 120; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 12px); display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(500px, calc(100vw - 32px)); pointer-events: none; }

@media (min-width: 768px) { .toasts { bottom: 20px; left: calc(50% + var(--nav-w) / 2); } body.sheet-open .toasts { left: calc((100vw - 520px) / 2); } }
.toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 8px; padding: 12px 16px; border-radius: var(--r-control); background: #1A1A1A; color: #E3E3E3; box-shadow: var(--shadow-400); font-size: 13px; line-height: 20px; font-weight: var(--fw-medium); animation: toastIn .2s ease-out; max-width: 100%; }
.toast .icon { display: none; }
@keyframes toastIn { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Tooltip */
.tip { position: fixed; z-index: 130; pointer-events: none; background: #FFFFFF; color: var(--text); padding: 4px 8px; border-radius: var(--r-control); font-size: 12px; line-height: 16px; box-shadow: var(--shadow-300), 0 0 0 1px rgba(0, 0, 0, .08); max-width: 240px; font-variant-numeric: tabular-nums; }

/* Empty */

.empty .icon { display: none; }
.empty b, .empty .empty-title { font-size: var(--fs-hmd); line-height: var(--lh-hmd); font-weight: var(--fw-semibold); color: var(--text); }
.empty span, .empty .empty-text { color: var(--text-secondary); }
.empty .btn { margin-top: 12px; }

/* More (phone) */

/* Settings status list */

/* ===== GST maths ===== */
// Line amounts: taxable = ex GST; gst_free / input_taxed = total; margin_scheme = sale price (GST-inclusive on the margin).
function lineGst(l) {
  if (l.gst === 'taxable') return round2(l.amount * 0.1);
  if (l.gst === 'margin_scheme') return l.atSettlement ? 0 : round2(Math.max(0, l.amount - (l.marginBase || 0)) / 11);
  return 0;
}
function lineTotal(l) { return l.gst === 'taxable' ? round2(l.amount * 1.1) : l.amount; }
function lineEx(l) { return round2(lineTotal(l) - lineGst(l)); }
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
function invEx(i) { return round2(sum(i.lines, lineEx)); }
function invGst(i) { return round2(sum(i.lines, lineGst)); }
function invTotal(i) { return round2(sum(i.lines, lineTotal)); }
function lineTotalSum(lines) { return sum(lines, lineTotal); }
function invGstFree(i) { return round2(sum(i.lines.filter(l => l.gst === 'gst_free'), lineTotal)); }
function totalText(i) { return fmtMoney(invTotal(i)) + (invGst(i) ? ' inc GST' : ' (no GST)'); }
function invTreatments(i) { return [...new Set(i.lines.map(l => l.gst))]; }
function gstChip(t, dir = 'in') { return `<span class="taxrate">${h(taxRateName(t, dir))}</span>`; }

function projectMoney(p) {
  const cats = {}; CATEGORIES.forEach(c => { cats[c] = { budget: (p.budget || {})[c] || 0, committed: 0, paid: 0 }; });
  const ensure = (c) => cats[c] || (cats[c] = { budget: 0, committed: 0, paid: 0 });
  (p.engagements || []).forEach(e => {
    const linked = sum(p.invoicesIn.filter(i => i.engagementId === e.id), invEx);
    ensure(e.category).committed += Math.max(e.value || 0, linked);
  });
  (p.invoicesIn || []).forEach(i => {
    const ex = invEx(i);
    if (!i.engagementId || !(p.engagements || []).some(e => e.id === i.engagementId)) ensure(i.category).committed += ex;
    if (i.status === 'paid') ensure(i.category).paid += ex;
  });
  const tot = { budget: 0, committed: 0, paid: 0 };
  Object.values(cats).forEach(c => { c.committed = round2(c.committed); c.paid = round2(c.paid); tot.budget += c.budget; tot.committed += c.committed; tot.paid += c.paid; });
  if (p.status === 'closed' && p.spent) { tot.budget = p.budgetTotal; tot.committed = p.spent; tot.paid = p.spent; }
  return { cats, tot };
}
function openTasks(p) { return p.tasks.filter(t => !t.done); }
function overdueTasks(p) { return openTasks(p).filter(t => t.due && t.due < TODAY); }
function nextDeadline(p) { return openTasks(p).filter(t => t.due >= TODAY).sort((a, b) => a.due.localeCompare(b.due))[0]; }

function quoteAge(q) { return q.requestedAt ? daysBetween(q.requestedAt, TODAY) : 0; }

function needsToday() {
  const items = [];
  liveProjects().forEach(p => {
    p.invoicesIn.filter(i => i.status === 'draft').forEach(i => items.push({ type: 'approval', p, sort: 0, icon: 'shield', tone: 'teal', title: `Approve bill ${i.number}: ${contactLabel(i.contactId)}`, meta: `${totalText(i)} · ${i.desc}`, href: `#/project/${p.id}/money/in?f=${i.id}` }));
    (p.invoicesOut || []).filter(o => o.status === 'draft').forEach(o => items.push({ type: 'approval', p, sort: 0, icon: 'shield', tone: 'teal', title: `Issue invoice ${o.number} to ${o.to}`, meta: `${fmtMoney(invTotal(o))} · ${o.desc}`, href: `#/project/${p.id}/money/out?f=${o.id}` }));
    p.engagements.filter(e => e.status === 'awaiting' || e.status === 'draft').forEach(e => items.push({ type: 'approval', p, sort: 0, icon: 'shield', tone: 'teal', title: `Issue purchase order: ${contactLabel(e.contactId)}`, meta: `${e.scope} · ${fmtMoney(e.value)} ex GST`, href: `#/project/${p.id}/engagements?f=${e.id}` }));
    overdueTasks(p).forEach(t => items.push({ type: 'overdue', p, sort: 1, icon: 'clock', tone: 'bad', title: t.title, meta: relDue(t.due).text, href: `#/project/${p.id}/stage/${t.stage}?f=${t.id}` }));
    p.rfqs.forEach(r => r.quotes.filter(q => q.status === 'requested' && quoteAge(q) > 7).forEach(q => items.push({ type: 'quote', p, sort: 2, icon: 'mail', tone: 'warn', title: `Chase ${contactLabel(q.contactId)}: ${r.scope}`, meta: `Requested ${quoteAge(q)} days ago, no quote yet`, href: `#/project/${p.id}/rfqs?f=${q.id}` })));
    p.invoicesIn.filter(i => i.status === 'approved' && i.due && daysBetween(TODAY, i.due) <= 7).forEach(i => items.push({ type: 'due', p, sort: 3, icon: 'dollar', tone: 'warn', title: `Pay ${contactLabel(i.contactId)}: ${i.number}`, meta: `${totalText(i)} · ${relDue(i.due).text}`, href: `#/project/${p.id}/money/in?f=${i.id}` }));

  return items.sort((a, b) => a.sort - b.sort);
}

function basQuarter(p, fy, q) {
  const r = quarterRange(fy, q);
  const ins = p.invoicesIn.filter(i => i.status !== 'draft' && inRange(i.date, r));
  const outs = (p.invoicesOut || []).filter(o => o.status !== 'draft' && inRange(o.date, r));
  const sales = round2(sum(outs, o => sum(o.lines.filter(l => !l.atSettlement), lineTotal)));
  const deposits = round2(sum(outs, o => sum(o.lines.filter(l => l.atSettlement), lineTotal)));
  const gstSales = round2(sum(outs, invGst));
  const purchases = round2(sum(ins, invTotal));
  const credits = round2(sum(ins, invGst));
  const gstFree = round2(sum(ins, invGstFree));
  const inputTaxed = round2(sum(ins, i => sum(i.lines.filter(l => l.gst === 'input_taxed'), lineTotal)));
  return { fy, q, label: QUARTERS[q - 1].label, range: r, sales, deposits, gstSales, purchases, credits, gstFree, inputTaxed, net: round2(gstSales - credits), ins, outs };
}
function projectFYs(p) {
  const dates = [p.started, ...p.invoicesIn.map(i => i.date), ...(p.invoicesOut || []).map(o => o.date)].filter(Boolean);
  const first = fyStartYear(dates.sort()[0] || TODAY); const last = fyStartYear(p.status === 'closed' ? (p.closed || TODAY) : TODAY);
  const out = []; for (let y = first; y <= last; y++) out.push(fyLabel(y)); return out;
}

function expiryStatus(c) {
  const list = [['Licence', c.licenceExpiry], ['Insurance', c.insuranceExpiry]].filter(x => x[1]);
  let worst = null;
  list.forEach(([k, dt]) => { const n = daysBetween(TODAY, dt); const lvl = n < 0 ? 2 : n < 60 ? 1 : 0; if (lvl && (!worst || lvl > worst.lvl || (lvl === worst.lvl && dt < worst.dt))) worst = { k, dt, n, lvl }; });
  return worst;
}
function expiryChip(c) {

function spendBar(m, opts = {}) {

  return `<div class="spend ${opts.slim ? 'slim' : ''}" role="img" aria-label="${h(label)}">${paidW > 0 ? `<i class="paid" style="width:${paidW.toFixed(2)}%" ${tip('Paid', paid)}></i>` : ''}${commW > 0.2 ? `<i class="committed" style="width:${commW.toFixed(2)}%" ${tip('Committed, not yet paid', Math.max(0, Math.min(committed, budget) - paid))}></i>` : ''}${overW > 0.2 ? `<i class="over" style="width:${overW.toFixed(2)}%" ${tip('Over budget', committed - budget)}></i>` : ''}</div>`;

}
function emptyState(ic, title, text, action = '') { return `<div class="empty"><b class="empty-title">${h(title)}</b><span class="empty-text">${h(text)}</span>${action}</div>`; }
const STATUS = {

  invoice: { draft: ['neutral', 'Draft'], issued: ['warning', 'Awaiting payment'], received: ['success', 'Paid'] },

}

        <nav class="ptabs" aria-label="Project status">${ptab({ label: 'Live', n: live.length, current: projTab === 'live', k: 'homeProj', v: 'live' })}${closed.length ? ptab({ label: 'Closed', n: closed.length, current: projTab === 'closed', k: 'homeProj', v: 'closed' }) : ''}</nav>

/* ===== View: Projects (cross-project register) ===== */

/* ===== View: Project ===== */
const PROJECT_TABS = [['stage', 'Stage & tasks'], ['rfqs', 'Quotes'], ['engagements', 'Engagements'], ['money', 'Money'], ['documents', 'Documents'], ['log', 'Log']];
function viewProject() {
  const p = getProject(route.parts[0]);
  if (!p) return `<div class="page">${pageHeader({ title: 'Project not found', back: '#/projects', backLabel: 'Projects' })}<div class="card">${emptyState('folder', 'Project not found', 'It may have been removed when the demo data was reset.', '<a class="btn" href="#/projects">All projects</a>')}</div></div>`;
  const tab = PROJECT_TABS.some(t => t[0] === route.parts[1]) ? route.parts[1] : 'stage';
  const selStage = tab === 'stage' ? Math.min(8, Math.max(1, +route.parts[2] || p.stage)) : p.stage;
  const approvals = p.invoicesIn.filter(i => i.status === 'draft').length + (p.invoicesOut || []).filter(o => o.status === 'draft').length;
  const awaitingEng = p.engagements.filter(e => e.status === 'awaiting' || e.status === 'draft').length;
  const outstandingQ = p.rfqs.reduce((a, r) => a + r.quotes.filter(q => q.status === 'requested').length, 0);
  const tabs = PROJECT_TABS.map(([k, label]) => ptab({ href: `#/project/${p.id}/${k}`, label, current: k === tab, n: k === 'money' ? (approvals || '') : k === 'engagements' ? (awaitingEng || '') : k === 'rfqs' ? (outstandingQ || '') : '', crit: k === 'stage' ? overdueTasks(p).length : 0 })).join('');
  const body = { stage: () => tabStage(p, selStage), rfqs: () => tabRfqs(p), engagements: () => tabEngagements(p), money: () => tabMoney(p), documents: () => tabDocuments(p), log: () => tabLog(p) }[tab]();
  const sub = `${h(p.company.name)}<span class="d-only"> · ${[`ABN ${p.company.abn}`, p.company.gst ? 'GST registered' : 'Not GST registered', `${p.lotPlan}, ${p.suburb} ${p.state}`].map(h).join(' · ')}</span>`;
  return `<div class="page page-full">
    ${pageHeader({ title: p.name, back: '#/projects', backLabel: 'Projects', badges: p.status === 'closed' ? badge('Closed', 'neutral') : stageChip(p.stage), sub, actions: `<button class="btn d-only" data-action="export" data-kind="full" data-p="${p.id}">Export workbook</button>` })}

function tabStage(p, n) {
  const s = stageInfo(n); const sp = stageProgress(p, n);
  const tasks = p.tasks.filter(t => t.stage === n).sort((a, b) => (a.done - b.done) || (a.due || '').localeCompare(b.due || ''));
  const isCur = p.status !== 'closed' && n === p.stage; const isDone = p.status === 'closed' || n < p.stage;
  const status = isCur ? badge('In progress', 'attention', 'partial') : isDone ? badge('Complete', 'neutral', 'complete') : badge('Not started', 'neutral', 'incomplete');
  const list = tasks.map(t => {
    const rd = relDue(t.due, t.done);
    return `<div class="task ${t.done ? 'done' : ''}" data-id="${t.id}">
      <button class="check" role="checkbox" aria-checked="${t.done}" data-action="toggle-task" data-p="${p.id}" data-id="${t.id}" aria-label="${t.done ? 'Mark not done' : 'Mark done'}: ${h(t.title)}">${icon('check')}</button>
      <div class="t-body"><div class="t-title">${h(t.title)}</div>
        <div class="t-meta"><span class="due ${rd.cls}">${h(rd.text)}</span>${t.lead && !t.done ? badge('Lead time', 'warning') : ''}<button class="link-btn" data-action="add-note" data-p="${p.id}" data-id="${t.id}">Add note</button></div>
        ${t.lead && !t.done ? `<div class="note lead">${h(t.lead)}</div>` : ''}
        ${(t.notes || []).map(nt => `<div class="note"><span class="when">${h(fmtDateTime(nt.ts))}</span>${h(nt.text)}</div>`).join('')}
      </div></div>`;
  }).join('');
  const stages = STAGES.map(x => {
    const xp = stageProgress(p, x.n); const done = p.status === 'closed' || x.n < p.stage; const cur = p.status !== 'closed' && x.n === p.stage;
    return `<a class="stage-item ${done ? 'done' : ''} ${cur ? 'current' : ''}" href="#/project/${p.id}/stage/${x.n}" ${x.n === n ? 'aria-current="step"' : ''} aria-label="Stage ${x.n}: ${h(x.name)}${done ? ', complete' : cur ? ', current' : ''}"><span class="pi pi-${done ? 'complete' : cur ? 'partial' : 'incomplete'}" aria-hidden="true"></span><span class="si-name">${x.n}. ${h(x.name)}</span><span class="si-n">${xp.done}/${xp.total}</span></a>`;
  }).join('');
  return `<div class="layout"><div>
    <section class="card">
      <div class="card-head"><div class="ch-titles"><h2 class="card-title">${h(s.name)}</h2>${status}</div>
        <div class="ch-actions"><button class="btn" data-action="add-task" data-p="${p.id}" data-stage="${n}">Add task</button>${isCur && n < 8 ? `<button class="btn" data-action="advance-stage" data-p="${p.id}">Move to stage ${n + 1}</button>` : ''}</div>
        <p class="card-sub">Stage ${n} of 8 · ${sp.done} of ${sp.total} tasks done${isCur && p.stageNote ? ` · ${h(p.stageNote)}` : ''}</p></div>
      <div class="task-list" style="border-top:1px solid var(--border-secondary)">${list || emptyState('list', 'No tasks in this stage', 'Add the first task for ' + s.name + '.')}</div>
    </section></div>
    <div>
      <section class="card"><div class="card-head"><h2 class="card-title">Stages</h2></div><nav class="stage-list" aria-label="Project stages">${stages}</nav></section>
      <section class="card"><div class="card-head"><h2 class="card-title">Project company</h2></div>
        <div class="card-section" style="padding-top:4px"><dl class="kv"><dt>Company</dt><dd>${h(p.company.name)}</dd><dt>ABN</dt><dd>${h(p.company.abn)}</dd>${p.company.acn ? `<dt>ACN</dt><dd>${h(p.company.acn)}</dd>` : ''}<dt>GST</dt><dd>${p.company.gst ? 'Registered' : 'Not registered'}</dd><dt>Site</dt><dd>${h(p.lotPlan)}, ${h(p.street)}, ${h(p.suburb)} ${h(p.state)}</dd><dt>Project</dt><dd>${h(p.type)} · ${h(p.yield)}</dd></dl></div></section>
    </div></div>`;
}

function tabRfqs(p) {
  const isOpen = (r) => !r.quotes.some(q => q.status === 'appointed');
  const scopes = p.rfqs.slice().sort((a, b) => (isOpen(b) - isOpen(a)) || (b.stage - a.stage));
  return `<div class="section-bar"><p class="help grow">Three quotes per scope from the same template. Contracts are with ${h(p.company.name)}.</p>

function scopeCard(p, r) {
  const received = r.quotes.filter(q => q.amount != null);
  const min = received.length > 1 ? Math.min(...received.map(q => q.amount)) : null;
  const appointedQ = r.quotes.find(q => q.status === 'appointed');

  const rows = r.quotes.map(q => {

    const recv = q.amount != null ? `<span class="nowrap">${dateCell(q.received)}</span>` : `<span class="${age > 7 ? 'crit' : ''}">Sent ${fmtDateShort(q.requestedAt)}, ${plural(age, 'day')} ago</span>`;
    let acts = '';
    if (q.status === 'requested') acts = `<button class="btn btn-micro" data-action="chase" data-p="${p.id}" data-r="${r.id}" data-id="${q.id}">Chase</button><button class="link-btn" data-action="add-quote" data-p="${p.id}" data-r="${r.id}" data-c="${q.contactId}">Log quote</button>`;

    return `<tr class="quote ${q.status === 'appointed' ? 'appointed-q' : ''} ${q.status === 'declined' ? 'declined-q' : ''}" data-id="${q.id}">

      <td class="m-meta m-lead nowrap">${statusChip(q.status, 'quote')}</td>
      <td class="num amt ${q.amount != null ? 'm-amt' : 'm-hide'}">${q.amount != null ? fmtMoney(q.amount) : '–'}${lowest ? '<div class="sub">Lowest</div>' : ''}</td>
      <td class="num m-hide">${q.amount != null ? fmtMoney(q.gst === 'taxable' ? q.amount * 1.1 : q.amount) : '–'}</td>
      <td class="m-meta d-nowrap">${recv}</td>
      <td class="list-cell ${q.inclusions && q.inclusions.length ? 'm-sub' : 'm-hide'}" data-label="Includes">${q.inclusions && q.inclusions.length ? h(q.inclusions.join(', ')) : '<span class="muted">–</span>'}</td>
      <td class="list-cell ${q.exclusions && q.exclusions.length ? 'm-sub' : 'm-hide'}" data-label="Excludes">${q.exclusions && q.exclusions.length ? h(q.exclusions.join(', ')) : '<span class="muted">–</span>'}</td>

      <div class="sh-actions"><button class="btn" data-action="add-quote" data-p="${p.id}" data-r="${r.id}">Add quote</button>${appointedQ ? '' : `<button class="btn" data-action="request-quote" data-p="${p.id}" data-r="${r.id}">Request quote</button>`}</div></div>
    ${rows ? `<div class="itable-wrap stack"><table class="itable"><thead><tr><th scope="col">Party</th><th scope="col">Status</th><th scope="col" class="num">Ex GST</th><th scope="col" class="num">Inc GST</th><th scope="col">Received</th><th scope="col">Includes</th><th scope="col">Excludes</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}
    ${banner}
    ${appointedQ && declinedN ? `<button type="button" class="compare-toggle" data-action="toggle-compare" aria-expanded="false">${icon('chevron-down', 'icon-sm')}<span>Compare with ${plural(declinedN, 'other quote')}</span></button>` : ''}

function tabEngagements(p) {

      <td class="num m-sub" data-label="Claimed">${e.value ? `${fmtMoney(claimed)} <span class="muted">· ${Math.round(pct)}%</span>` : '<span class="muted">On settlement</span>'}</td>
      <td class="w-bar m-bar">${e.value ? `<div class="meter" role="img" aria-label="${Math.round(pct)}% claimed"><span style="width:${pct.toFixed(1)}%"></span></div>` : ''}</td>

  }).join('');
  return `<section class="card">

const ROLE_GROUPS = [
  ['Consultants', ['Town planner', 'Surveyor', 'Civil engineer', 'Geotech', 'Ecology', 'Bushfire', 'Traffic engineer']],
  ['Contractors', ['Civil contractor', 'Electrical', 'NBN', 'Landscaping', 'Builder']],
  ['Agents & advisers', ["Buyer's agent", 'Solicitor', 'Real estate agent', 'Accountant', 'Project manager']],
  ['Council & government', ['Council', 'Government']],
  ['Banks & vendors', ['Bank', 'Vendor']],
];
function roleGroup(role) { const g = ROLE_GROUPS.find(([, rs]) => rs.includes(role)); return g ? g[0] : 'Other'; }
function viewContacts() {
  const q = ui.contactQ.trim().toLowerCase();
  const groups = ['All', ...ROLE_GROUPS.map(g => g[0]).filter(g => state.contacts.some(c => roleGroup(c.role) === g)), ...(state.contacts.some(c => roleGroup(c.role) === 'Other') ? ['Other'] : [])];
  const group = groups.includes(ui.contactRole) ? ui.contactRole : 'All';
  const list = state.contacts.slice().sort((a, b) => (a.id === 'wellco') - (b.id === 'wellco')).filter(c => (group === 'All' || roleGroup(c.role) === group) && (!q || [c.name, c.company, c.role, c.abn, c.notes].join(' ').toLowerCase().includes(q)));

/* ===== Forms ===== */
const lines = (s) => String(s || '').split(/\n|;/).map(x => x.trim()).filter(Boolean);
const FORMS = {
  'top-search': (f, fd) => { ui.contactQ = String(fd.get('q') || '').trim(); ui.contactRole = 'All'; go('#/contacts'); },
  'add-task': (f, fd) => { const p = getProject(f.dataset.p); const t = { id: newId('t'), stage: +f.dataset.stage, title: fd.get('title').trim(), due: fd.get('due'), done: false, doneAt: null, notes: [], lead: (fd.get('lead') || '').trim() || null }; p.tasks.push(t); addLog(p, 'Task added: ' + t.title, 'task'); closeSheet(); commit(); toast('Task added'); },
  'add-note': (f, fd) => { const p = getProject(f.dataset.p); const t = p.tasks.find(x => x.id === f.dataset.id); t.notes = t.notes || []; t.notes.push({ ts: nowTs(), text: fd.get('text').trim() }); addLog(p, `Note on "${t.title}": ${fd.get('text').trim()}`, 'note'); closeSheet(); commit(); toast('Note saved'); },
  'new-scope': (f, fd) => { const p = getProject(f.dataset.p); const r = { id: newId('r'), scope: fd.get('scope').trim(), stage: +fd.get('stage'), category: fd.get('category'), quotes: [] }; p.rfqs.push(r); addLog(p, 'Scope created: ' + r.scope, 'note'); closeSheet(); commit(); toast('Scope created. Request three quotes when ready'); },
  'add-quote': (f, fd) => {
    const p = getProject(f.dataset.p); const r = findRfq(p, f.dataset.r); const cid = fd.get('party'); const c = contactById(cid);
    let q = r.quotes.find(x => x.contactId === cid && x.status === 'requested');
    if (!q) { q = { id: newId('q'), contactId: cid, requestedAt: null }; r.quotes.push(q); }
    Object.assign(q, { amount: +fd.get('amount'), gst: fd.get('gst'), received: fd.get('received'), validUntil: fd.get('valid'), status: 'received', inclusions: lines(fd.get('inc')), exclusions: lines(fd.get('exc')) });
    p.docs.push({ id: newId('f'), type: 'Quote', party: partyKey(c), date: q.received, title: 'Quote: ' + r.scope, size: 310, tags: [r.scope] });
    addLog(p, `Quote received from ${c.company} for ${r.scope}: ${fmtMoney(q.amount)} ex GST`, 'money'); closeSheet(); commit(); toast('Quote saved and filed');
  },
  'appoint': (f, fd) => {
    const p = getProject(f.dataset.p); const r = findRfq(p, f.dataset.r); const q = r.quotes.find(x => x.id === f.dataset.id); const reason = fd.get('reason').trim(); const value = +fd.get('value') || q.amount;
    r.quotes.forEach(x => { if (x !== q && x.status === 'received') x.status = 'declined'; });
    q.status = 'appointed'; r.appointed = { reason, date: TODAY };
    const e = { id: newId('e'), contactId: q.contactId, scope: r.scope, category: r.category, value, status: 'awaiting', issued: null };
    p.engagements.push(e);
    addLog(p, `Appointed ${contactLabel(q.contactId)} for ${r.scope} (${fmtMoney(value)} ex GST). Reason: ${reason}`, 'appoint');
    closeSheet(); commit(); toast('Appointed. Purchase order drafted for your approval');
  },
  'add-invoice': (f, fd) => {
    const p = getProject(f.dataset.p); const dir = f.dataset.dir; const base = (p.sales && p.sales[0] && p.sales[0].marginBase) || 0;
    const descs = fd.getAll('ldesc'), amts = fd.getAll('lamt'), gsts = fd.getAll('lgst');
    const ls = descs.map((d0, i) => { const l = { desc: d0.trim(), amount: +amts[i] || 0, gst: gsts[i] }; if (l.gst === 'margin_scheme') l.marginBase = base; return l; });
    const inv = { id: newId('i'), number: fd.get('number').trim(), date: fd.get('date'), due: fd.get('due') || addDays(fd.get('date'), 14), desc: fd.get('desc').trim(), lines: ls, status: 'draft', paidDate: null };
    if (dir === 'in') {
      Object.assign(inv, { contactId: fd.get('party'), category: fd.get('category'), engagementId: fd.get('engagement') || null, intercompany: fd.get('party') === 'wellco' });
      p.invoicesIn.push(inv); p.docs.push({ id: newId('f'), type: 'InvoiceIn', party: partyKey(contactById(inv.contactId)), date: inv.date, title: 'Invoice ' + inv.number, size: 140, tags: [inv.category] });
      addLog(p, `Invoice ${inv.number} from ${contactLabel(inv.contactId)} added (${totalText(inv)}). Waiting for approval`, 'money');
      ui.fyIn = 'all'; closeSheet(); commit(); toast('Invoice added. It\'s waiting for your approval');
    } else {
      inv.to = fd.get('to').trim(); p.invoicesOut = p.invoicesOut || []; p.invoicesOut.push(inv);
      addLog(p, `Invoice ${inv.number} to ${inv.to} drafted (${fmtMoney(invTotal(inv))})`, 'money'); closeSheet(); commit(); toast('Draft saved. Review and issue when ready');
    }
  },
  'pay-invoice': (f, fd) => { const p = getProject(f.dataset.p); const i = p.invoicesIn.find(x => x.id === f.dataset.id); i.status = 'paid'; i.paidDate = fd.get('date'); addLog(p, `Paid ${contactLabel(i.contactId)} ${i.number}: ${fmtMoney(invTotal(i))} (ref ${fd.get('ref')})`, 'money'); closeSheet(); commit(); toast('Marked paid. Budget updated'); },
  'edit-budget': (f, fd) => { const p = getProject(f.dataset.p); p.budget = p.budget || {}; CATEGORIES.forEach(c => { p.budget[c] = +fd.get(c) || 0; }); addLog(p, 'Feaso budget updated: ' + fmtMoney(sum(CATEGORIES, c => p.budget[c])) + ' ex GST', 'money'); closeSheet(); commit(); toast('Budget saved'); },
  'upload': (f, fd) => {
    const p = getProject(f.dataset.p); const file = sheetCtx && sheetCtx.file;
    if (!file) { toast('Choose a file first', 'info'); return; }
    const c = contactById(fd.get('party')); const ext = (file.name.split('.').pop() || 'pdf').toLowerCase().slice(0, 4);
    const d0 = { id: newId('f'), type: fd.get('type'), party: partyKey(c), date: TODAY, title: (fd.get('title') || '').trim() || file.name, size: Math.max(1, Math.round(file.size / 1024)), tags: [], ext };
    p.docs.push(d0); addLog(p, 'Document uploaded: ' + docName(p, d0), 'doc'); ui.docFolder = d0.type; closeSheet(); commit(); toast('Stored in Supabase bucket project-documents (demo)', 'upload');
  },
  'add-contact': (f, fd) => { const c = { id: newId('c'), name: fd.get('name').trim(), company: fd.get('company').trim(), role: fd.get('role'), abn: fd.get('abn').trim(), email: fd.get('email').trim(), phone: fd.get('phone').trim(), licenceExpiry: fd.get('licenceExpiry') || null, insuranceExpiry: fd.get('insuranceExpiry') || null, rating: 4, notes: fd.get('notes').trim() }; state.contacts.push(c); closeSheet(); commit(); toast(c.company + ' added to contacts'); },
  'add-deal': (f, fd) => { const dl = { id: newId('D'), address: fd.get('address').trim(), lotPlan: fd.get('lotPlan').trim(), source: fd.get('source').trim() || 'Listing', asking: +fd.get('asking') || 0, yield: fd.get('yield').trim() || 'TBC', zoning: fd.get('zoning').trim() || 'TBC', feaso: 'pending', margin: null, logged: TODAY, notes: fd.get('notes').trim() }; state.deals.unshift(dl); closeSheet(); commit(); toast('Site logged. Run the feaso next'); },
  'settings': (f, fd) => { ['company', 'abn', 'address', 'director', 'established', 'trust', 'trustee', 'feeBasis', 'feeNote', 'signature'].forEach(k => { state.settings[k] = fd.get(k); }); state.settings.feeAmount = +fd.get('feeAmount') || 0; commit(); toast('Settings saved'); },
  'wiz1': (f, fd) => { ['street', 'suburb', 'state', 'type', 'lot', 'planType', 'planNo', 'yield'].forEach(k => { wiz[k] = (fd.get(k) || '').trim(); }); wiz.id = fd.get('id').trim().toUpperCase(); if (state.projects.some(p => p.id === wiz.id)) { toast('That project ID is already used', 'warning'); return; } if (!wiz.company) wiz.company = wiz.suburb + ' Developments Pty Ltd'; wiz.step = 2; render(); },
  'wiz2': (f, fd) => { ['company', 'abn', 'acn', 'bank', 'bsb', 'acc', 'price'].forEach(k => { wiz[k] = (fd.get(k) || '').trim(); }); wiz.gst = !!fd.get('gst'); wiz.step = 3; render(); },
};
function createProjectFromWizard() {
  const w = wiz; const start = w.dealId ? 3 : 1; const base = w.dealId ? addDays(TODAY, -21) : TODAY;
  const price = +w.price || 0;
  const p = {
    id: w.id, name: `${w.street}, ${w.suburb}`, street: w.street, suburb: w.suburb, state: w.state, lotPlan: `Lot ${w.lot} ${w.planType} ${w.planNo}`, type: w.type, yield: w.yield || 'TBC',
    status: 'live', stage: start, council: null, started: TODAY,
    company: { name: w.company, abn: w.abn || 'Applied for', acn: w.acn, gst: w.gst, gstFrom: TODAY, bank: w.bank, bsb: w.bsb, acc: w.acc, tfn: 'To apply' },
    stageNote: w.dealId ? 'Created from a Go deal. Next: exchange and due diligence.' : '',
    budget: { 'Acquisition': Math.round(price * 1.06 / 1000) * 1000, 'Holding': 0, 'Consultants': 0, 'Council & Gov': 0, 'Construction': 0, 'Sales': 0, 'Management fee': state.settings.feeAmount || 0 },
    tasks: TEMPLATE_TASKS.map(([stage, title, off, lead]) => ({ id: newId('t'), stage, title, due: addDays(base, off), done: stage < start, doneAt: stage < start ? addDays(base, off) : null, notes: [], lead: lead || null })),
    rfqs: [], engagements: [], invoicesIn: [], invoicesOut: [], sales: [], trust: [], docs: [], log: [],
  };
  if (w.dealId) { const dl = state.deals.find(x => x.id === w.dealId); dl.projectId = p.id; addLog(p, `Project created from deal: ${dl.address} (feaso Go, ${dl.margin}% margin)`, 'deal'); }
  const reg = p.tasks.find(t => t.title.startsWith('Register project company')); reg.done = true; reg.doneAt = TODAY;
  addLog(p, `${p.company.name} set up as the project company, 100% held by ${state.settings.trust}. Approved by Dan`, 'company');
  addLog(p, `Stage checklist (${p.tasks.length} tasks), budget skeleton and 10 document folders created`, 'note');
  state.projects.push(p); wiz.done = true; save();
  toast(`${p.id} created`); go(`#/project/${p.id}/stage/${p.stage}`);
}
function updateUploadPreview() {
  const f = $('#f-upload'); if (!f) return; const p = getProject(f.dataset.p);
  const c = contactById(f.querySelector('[name=party]').value); const file = sheetCtx && sheetCtx.file;
  const ext = file ? (file.name.split('.').pop() || 'pdf').toLowerCase().slice(0, 4) : 'pdf';
  $('#u-name').textContent = docName(p, { type: f.querySelector('[name=type]').value, party: partyKey(c), date: TODAY, ext });
}
function openWelcome() {
  const claim = (getProject('CROOBYAR') || { invoicesIn: [] }).invoicesIn.find(i => i.number === 'SCC-PC06');
  openSheet({ title: 'Welcome, Dan',
    body: `<div class="is-modal welcome">${logoHTML('welcome-logo')}
      <p>This is a working demo of the Wellco project brain, loaded with four sample projects: Croobyar Rd, Ulladulla, Jimboomba and Vincentia.</p>
      <p>Approve bills, request quotes and download the Excel workbooks. Nothing you do here is sent anywhere.</p>
      <h3 class="welcome-h">Try this</h3>
      <ul class="try">
        <li><button type="button" data-action="welcome-go" data-href="#/project/CROOBYAR/money/in${claim ? '?f=' + claim.id : ''}"><span class="try-title">Approve a progress claim</span><span class="try-sub">Southcoast Civil's claim #6 on Croobyar</span></button></li>
        <li><button type="button" data-action="welcome-go" data-href="#/project/CROOBYAR/rfqs"><span class="try-title">Request quotes</span><span class="try-sub">Landscaping on Croobyar, from your RFQ template</span></button></li>
        <li><button type="button" data-action="welcome-go" data-href="#/exports"><span class="try-title">Download a year-end workbook</span><span class="try-sub">The Excel file your accountant gets for FY2025-26</span></button></li>
      </ul></div>`,
    foot: `<button type="button" class="btn btn-primary" data-action="welcome-close">Have a look around</button>` });
}

/* ===== Events ===== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = ACTIONS[el.dataset.action]; if (!fn) return;
  if (el.tagName === 'A' && el.dataset.action === 'close-sheet') { closeSheet(); return; }
  e.preventDefault(); fn(el, e);
});
document.addEventListener('submit', (e) => { const f = e.target; const fn = FORMS[f.dataset.form]; if (fn) { e.preventDefault(); fn(f, new FormData(f)); } });
document.addEventListener('input', (e) => {
  const el = e.target; const k = el.dataset && el.dataset.input; if (!k) return;
  if (k === 'contact-search') { ui.contactQ = el.value; const html = viewContacts(); const tmp = document.createElement('div'); tmp.innerHTML = html; $('#contact-grid').replaceWith(tmp.querySelector('#contact-grid')); }
  if (k === 'inv-calc') updateInvoiceCalc();
  if (k === 'upload-preview') updateUploadPreview();
  if (k === 'wiz-suburb' && wiz) { const idEl = $('#w-id'); if (idEl && (!idEl.value || idEl.dataset.auto)) { idEl.value = el.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); idEl.dataset.auto = '1'; } }
});
document.addEventListener('change', (e) => {
  const el = e.target; const k = el.dataset && el.dataset.input; if (!k) return;
  if (k === 'ui') { ui[el.dataset.k] = el.value; render(); const s = el.id && document.getElementById(el.id); if (s) s.focus(); }
  if (k === 'exp-fy') { ui.expFY[el.dataset.p] = el.value; render(); const s = $('#fy-' + CSS.escape(el.dataset.p)); if (s) s.focus(); }
  if (k === 'inv-calc') updateInvoiceCalc();
  if (k === 'upload-preview') updateUploadPreview();
  if (k === 'rfq-rcpt') {
    const p = getProject(el.dataset.p); const r = findRfq(p, el.dataset.r);
    sheetPicked = [...document.querySelectorAll('#sheet input[name=rcpt]:checked')].map(x => x.value);
    const btn = $('#sheet [data-action="sheet-approve"]'); if (btn) btn.disabled = !sheetPicked.length;
    if (sheetPicked.length) { const cid = sheetPicked[0]; $('#sheet [data-email-to]').innerHTML = recipientLine(cid, sheetPicked.length - 1); const body = $('#sheet [data-email-body]'); if (body && body.tagName !== 'TEXTAREA') body.textContent = rfqBody(p, r, cid); const att = $('#sheet .attach'); if (att) att.innerHTML = rfqAttachments(p, r, cid).map(a => `<div>${icon('file', 'icon-sm')}${h(a)}</div>`).join(''); }
  }
});
$('#file-input').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0]; if (!file || !sheetCtx) return;
  sheetCtx.file = { name: file.name, size: file.size };
  const lbl = $('#u-file'); if (lbl) lbl.textContent = `${file.name} · ${Math.max(1, Math.round(file.size / 1024))} KB`;
  updateUploadPreview();
});
document.addEventListener('keydown', (e) => {
  if (sheetEl.hidden) return;
  if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
  if (e.key === 'Tab') {
    const f = [...sheetEl.querySelectorAll('a[href], button:not([disabled]), input:not([type=hidden]), select, textarea, [tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
scrimEl.addEventListener('click', closeSheet);
document.addEventListener('mouseover', (e) => { const t = e.target.closest('[data-tip]'); if (t) showTip(t); else if (!tipEl.hidden) hideTip(); });
document.addEventListener('focusin', (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); else hideTip(); });
window.addEventListener('scroll', hideTip, { passive: true });
window.addEventListener('hashchange', () => { if (!sheetEl.hidden) closeSheet(); render(true); });
if (IN_ARTIFACT) document.addEventListener('click', (e) => { const a = e.target.closest && e.target.closest('a[href^="#/"]'); if (a) { e.preventDefault(); go(a.getAttribute('href')); } }, true);

/* ===== Boot ===== */
(function boot() {
  mountLogos();
  if (!IN_ARTIFACT && !location.hash) history.replaceState(null, '', '#/home');
  render(true);
  if (!state.welcomed) setTimeout(openWelcome, 400);
})();
</script>
</body>
